  /* ============ 对话顶条「更多」会话菜单 ============ */
  .subMenu {

  .dialog {

  .toggle {

  .themeCard b { font-size: var(--fs-12-5); }
  .themeCard small { font-size: var(--fs-11); color: var(--color-faint); line-height: 1.5; }

  /* ============ Toast / demo 控制条 / 说明 ============ */
  .toast {

    padding: 7px 16px;
    border-radius: var(--radius-pill);

  .demoBar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);

    max-width: min(96vw, 1080px);
    padding: 8px 14px;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-lg);
    background: color-mix(in oklab, var(--color-surface) 90%, transparent);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-2);
    transition: opacity var(--duration-base) var(--ease-out);

  }

    border-color: var(--color-accent); background: var(--color-accent-9); color: var(--color-accent-ink);

  .dbtn .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(120deg, var(--da), var(--db)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--color-fg) 12%, transparent); }
  .demoDivider { width: 1px; align-self: stretch; background: var(--color-border); }

  .infoPop {

  /* ============ 动画 ============ */
  @keyframes grad-flow { 0%, 100% { background-position: 0% 30%; } 50% { background-position: 100% 70%; } }
  @keyframes msg-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* 弹窗抽纸式（macOS sheet）：以顶边为轴从上方抽出展开 + 弹簧回弹；收起为反向回抽 */
  @keyframes sheet-in {
    0% { transform: translateY(-46px) scaleY(0.25); opacity: 0; }
    45% { transform: translateY(0) scaleY(1.07); opacity: 1; }
    65% { transform: translateY(0) scaleY(0.96); }
    80% { transform: translateY(0) scaleY(1.02); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @keyframes sheet-out { from { transform: translateY(0) scaleY(1); opacity: 1; } to { transform: translateY(-36px) scaleY(0.2); opacity: 0; } }
  @keyframes mask-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mask-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes spinner-rotate { to { transform: rotate(360deg); } }
  @keyframes draft-cursor { 50% { opacity: 0; } }
  @keyframes node-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes status-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes status-sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes status-drop { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }
  @keyframes failed-shake { 0% { transform: translateX(0); } 20% { transform: translateX(-2px); } 40% { transform: translateX(2px); } 60% { transform: translateX(-1px); } 80% { transform: translateX(1px); } 100% { transform: translateX(0); } }
  @keyframes appr-in { 0% { opacity: 0; transform: translateY(-8px); } 55% { background: var(--color-accent-8-t); } 100% { opacity: 1; transform: none; } }
  @keyframes cnt-pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes menu-out { to { opacity: 0; } }
  /* 菜单统一退场（JS hideMenu 先播动画再摘 .show / 移除；infoPop 带 translateX 定位，退场仅淡出不动 transform） */
  .wsMenu.closing, .notifMenu.closing, .subMenu.closing, .modeMenu.closing, .infoPop.closing { animation: menu-out 0.15s ease-in forwards; }

  /* ============ 窗口尺寸（容器查询；最小窗口 1080，断点 1280 / 1080） ============ */
  @container (width <= 1280px) {
    .sidebar { --sidebar-w: 238px; }
    .inspector { --insp-w: 340px; }
    /* 窄档禁用拖拽调宽（宽度回落到断点分档，拖宽仅在 >1280 生效） */
    .insGrip { display: none; }

  @container (width <= 1080px) {
    /* 审批面板脱离文档流，变右缘覆盖抽屉 */
    .inspector {
      position: absolute; top: 0; bottom: 0; right: 0; z-index: 20;
      --insp-w: min(400px, 86cqw);
      box-shadow: var(--shadow-2);
      border-left: 1px solid var(--color-border-strong);
    }
    .inspector.closedDock { margin-right: 0; transform: translateX(103%); }
    .paneInner { padding: 18px 22px 48px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="appFrame" id="appFrame" data-platform="win">
    <header class="titlebar" id="titlebar"></header>
    <div class="shellBody">
      <aside class="sidebar" id="sidebar"></aside>

      <aside class="inspector" id="inspector"></aside>

    <div class="scrim" id="inspScrim" data-act="insClose"></div>

      <div class="dialogContent" id="settingsContent"></div>
    </div>
  </div>
</div>

<div class="infoPop" id="infoPop"></div>
<div class="dialogMask" id="apMask"></div>
<div class="toast" id="toast"></div>
<div class="demoBar" id="demoBar"></div>
<button class="iconBtn barToggle" id="barToggle" data-act="barShow" style="display:none; background: var(--color-surface); box-shadow: var(--shadow-2); border:1px solid var(--color-border-strong);" title="展开 demo 控制条"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3"/><path d="M14 2v4M8 10v4M16 18v4"/></svg></button>

<script>
"use strict";
/* ================= 图标（lucide 风格内联 SVG） ================= */
const P = {
  panelLeft: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',

/* 长任务等待动画：全屏分步加载遮罩（步骤逐个点亮），完成后收起并回调。
   用于打开 / 切换项目、打开其他项目等阻塞操作。 */
let loadingTimer = null;
function runLoading(title, steps, done) {
  const mask = $("loadingMask");
  if (mask.classList.contains("show")) return;
  mask.innerHTML = `<div class="loadingCard">
    <span class="loadingOrb"></span>
    <div class="loadingTitle">${esc(title)}</div>
    <div class="loadingSteps">${steps.map((s, i) => `<div class="loadingStep" data-i="${i}"><span class="tick">${ic("check", 11, 2.6)}</span>${esc(s)}</div>`).join("")}</div>
  </div>`;
  mask.classList.add("show");
  steps.forEach((_, i) => setTimeout(() => {
    mask.querySelectorAll(`.loadingStep[data-i="${i}"]`).forEach(el => el.classList.add("on"));
  }, 300 * (i + 1)));
  clearTimeout(loadingTimer);
  loadingTimer = setTimeout(() => {
    mask.classList.remove("show");
    if (done) done();
  }, 300 * steps.length + 550);
}

/* 大纲树：任意层级嵌套 + 引导线（saga/arc/sequence/… 可省中间层，叶为 scene）；
   act 参数：内容视图左栏用 unitSel（就地选中），右栏内容目录用 unitSelJump（跳到内容视图） */
function treeNodeHTML(n, act = "unitSel") {
  const isParent = !!n.children;
  const open = !!n.open;
  const active = state.selUnit === n.id;
  const real = realState(n);
  const row = `<div class="dirRow treeRow${isParent ? " parent" : " leaf"}${active ? " active" : ""}${isParent && open ? " open" : ""}" data-act="${act}" data-id="${n.id}" title="${esc(n.title)} · ${n.scope}">
    ${isParent
      ? `<span class="chev" data-act="treeChev" data-id="${n.id}">${ic("chevRight", 12, 2.2)}</span>`
      : `<span class="treeTick"></span>`}
    <span class="treeLabel">${esc(n.title)}</span>
    ${isParent ? `<span class="chip faint" style="padding:0 6px;">${SCOPE_MAP[n.scope][0]}</span>` : ""}
    ${real === "blocked" || real === "abandoned" ? "" : (n.progress ? `<span class="miniNum">${n.progress.c}/${n.progress.t}</span>` : "")}
    ${chip(REAL_MAP[real])}
  </div>`;
  return `<div class="treeNode">${row}${isParent && open ? `<div class="treeChildren">${n.children.map(c => treeNodeHTML(c, act)).join("")}</div>` : ""}</div>`;
}

  },
];
let askSel = {};   // qid → { picks: Set<optionIdx|"other">, other, text }
let askOpen = 0;   // 展开的 qid（-1 全收起）
let askDone = false;

function askIsAnswered(q) {
  const s = askSel[q.id] || {};
  return q.open ? (s.text || "").trim() !== "" : ((s.picks && s.picks.size) > 0 || (s.other || "").trim() !== "");
}
const askAnsweredN = () => ASK_QUESTIONS.filter(askIsAnswered).length;

function askItemBodyHTML(q) {
  const s = askSel[q.id] || {};
  let body = "";
  if (q.context) body += `<div class="qContext">${q.context}</div>`;
  if (q.open) {
    body += `<textarea class="openInput" data-qid="${q.id}" placeholder="${esc(q.placeholder || "")}" rows="3">${esc(s.text || "")}</textarea>`;
  } else {
    body += `<div class="optList">` + q.options.map((o, i) => `
      <div class="opt${q.multi ? " multi" : ""}${s.picks && s.picks.has(i) ? '" data-selected="' : ""}" data-qid="${q.id}" data-oi="${i}">
        <span class="optMark"></span>
        <span class="optLabel">${esc(o.label)}${o.rec ? '<span class="recBadge">推荐</span>' : ""}</span>
        <span class="optDesc">${o.desc}</span>
      </div>`).join("") + `
      <div class="opt${(s.other || "").trim() !== "" ? '" data-selected="' : ""}" data-qid="${q.id}" data-oi="other">
        <span class="optMark"></span>
        <span class="optLabel">其他</span>
        <input class="otherInput" data-qid="${q.id}" placeholder="自填你的答案" value="${esc(s.other || "")}">
      </div>
    </div>`;
  }
  return `<div class="qFull">${esc(q.question)}</div>${body}`;
}

/* 已答简约记录行：只渲染「题目 → 答案」 */
function askDoneRowHTML(q) {
  const s = askSel[q.id] || {};
  let answer, self = false, quiet = false;
  if (q.open) {
    const t = (s.text || "").trim();
    if (t === "") { answer = "跳过 · 授权自行决断"; quiet = true; }
    else { answer = t; self = true; }
  } else {
    const picks = [...(s.picks || [])].filter((i) => i !== "other").map((i) => q.options[i].label);
    const other = (s.other || "").trim();
    if (picks.length === 0 && other === "") { answer = "跳过 · 授权自行决断"; quiet = true; }
    else {
      const parts = [...picks, ...(other !== "" ? ["其他：" + other] : [])];
      answer = parts.join("、") + (q.multi && picks.length > 1 ? `（多选 ${picks.length} 项）` : "");
    }
  }
  return `<div class="recRow"><span class="q">${esc(q.question)}</span><span class="arr">→</span><span class="a${self ? " self" : ""}${quiet ? " quiet" : ""}">${esc(answer)}</span></div>`;
}

/* leaf 绑定 → 可点击 chip（引用角色 / 地点档案；involvement 见 model LeafCharacterBinding / LeafLocationBinding） */
function leafCharChips(u) {
  return (((u.leaf && u.leaf.characters) || [])).map(b => {
    const c = CHARS.find(x => x.id === b.id);
    const inv = b.involvement;
    const tag = inv ? [inv.roles.map(r => LEAF_ROLE[r]).join("/"), LEAF_PRESENCE[inv.presence]].filter(Boolean).join(" · ") : "";
    return `<button class="refChip" data-act="charSel" data-id="${b.id}">${ic("userRound", 11)}${esc(c ? c.name : b.id)}${tag ? `<small style="font-size:var(--fs-10-5);color:var(--color-faint);font-weight:var(--fw-regular);">${tag}</small>` : ""}</button>`;
  }).join("");
}
function leafLocChips(u) {
  return (((u.leaf && u.leaf.locations) || [])).map(b => {
    const l = LOCS.find(x => x.id === b.id);
    const inv = b.involvement;
    const tag = inv ? [LEAF_LOC_ROLE[inv.role], inv.affected ? "受影响" : ""].filter(Boolean).join(" · ") : "";
    return `<button class="refChip" data-act="locSel" data-id="${b.id}">${ic("mapPin", 11)}${esc(l ? l.name : b.id)}${tag ? `<small style="font-size:var(--fs-10-5);color:var(--color-faint);font-weight:var(--fw-regular);">${tag}</small>` : ""}</button>`;
  }).join("");
}
/* 场景计划 leaf：仅 scene 叶单元（人物/地点绑定、事件序列、节奏拍、实体状态变更） */

let apCursor = 3;
let apEnterId = null, apPulseId = null, apCntPop = false;

/* 审批整体弹窗：左清单 + 右详情（审批是阻塞的——挂起时不能发送，弹窗即"必须先决策"；
   稍后处理可收起，由 顶部提示条 / 状态行 / 工具行 唤回；处理完不留过往记录） */
function apModalDetailHTML(g) {

    }

      <div class="apSectionHead">${ic(g.op === "delete" ? "x" : g.op === "add" ? "plus" : "edit", 11)}${g.op === "delete" ? "删除参数" : g.op === "edit" ? "变更后" : "写入内容"}</div>

        <div class="apBody">
          ${g.stale ? `<div class="apStale">版本已过期：正式稿已被其他修改更新，批准后此操作可能执行失败</div>` : ""}
          <dl class="apParam">${g.params.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>

      <b>审批 · 本轮工具调用</b>

      <button class="btn btnGhost btnSm" data-act="apLater">${ic("clock", 12)}稍后处理</button>

      <aside class="apList">

              <span class="aliText"><b>${esc(g.tool)} · ${esc(g.title)}</b><small>${g.kind === "exit" ? "ExitComposeMode" : ({ add: "写入", edit: "编辑", delete: "删除" }[g.op] || "")}</small></span>

function openApModal() { state.modalOpen = true; renderApModal(); }
/* 决策后联动：刷新对话流工具行；全部处理完 → 弹窗自动收口 + toast（不留过往记录） */
function apFinishIfNeeded() {
  if (state.view === "chat") renderMain();
  if (pendingN() > 0) return;
  setTimeout(() => {
    closeApModal();
    toast("本轮审批已全部处理，会话继续");
  }, 600);
}
/* 收起审批弹窗：先播 sheet-out 收纸 + 遮罩淡出，动画结束后再卸载 DOM（重开由 renderApModal 清 .closing 防竞态） */
function closeApModal() {
  if (!state.modalOpen) return;
  state.modalOpen = false;
  const mask = $("apMask");
  mask.classList.add("closing");
  updateAlertBar();
  setTimeout(() => {
    if (!mask.classList.contains("closing")) return;
    mask.classList.remove("show", "closing");
    mask.innerHTML = "";
  }, 300);
}
function apLater() {
  closeApModal();
  if (pendingN() > 0) toast("已稍后处理——顶部提示条 · 状态行 · 工具行均可唤回审批弹窗");
}
/* 收起设置弹窗：同样先播 sheet-out + 遮罩淡出再摘 .show */
function closeSettings() {
  const m = $("settingsMask");
  if (!m.classList.contains("show") || m.classList.contains("closing")) return;
  m.classList.add("closing");
  setTimeout(() => {
    if (!m.classList.contains("closing")) return;
    m.classList.remove("show", "closing");
  }, 300);
}
/* 挂起提示条（对话视图顶部）：有待决且弹窗收起时常驻，点击唤回；出现/消失均有动画 */
function updateAlertBar() {
  const bar = $("apAlertBar");
  if (!bar) return;
  const show = pendingN() > 0 && !state.modalOpen;
  const c = bar.querySelector("#alertN");
  if (c) c.textContent = pendingN();
  if (show) {
    bar.classList.remove("leaving");
    clearTimeout(bar._t);
    bar.style.display = "flex";
  } else if (bar.style.display !== "none" && !bar.classList.contains("leaving")) {
    bar.classList.add("leaving");
    clearTimeout(bar._t);
    bar._t = setTimeout(() => {
      if (!bar.classList.contains("leaving")) return;
      bar.classList.remove("leaving");
      bar.style.display = "none";
    }, 250);
  }
}

/* ================= 右栏 · 内容目录 =================
   对话视图常驻：大纲树（点击跳内容视图单元详情）/ 人物 / 地点（行点击展开详情卡，
   「打开完整档案」跳内容视图完整档案）；对话流实体标签点击在此定位。 */
function dirDetailCardHTML(type, id) {
  const meta = ENT[type];

  if (!e) return "";

      <li><b>一轮会话只展示最后一次 call 的返回</b>：每轮助手消息带头像 / 名称 / 时间 / 模式 chip；工具调用以分组条带（左侧强调线）夹在正文中间，含已完成 / 失败 / 运行中三态，中间结果不单独渲染成正文。</li>
      <li><b>长任务等待动画</b>：新建会话 = 按钮内 spinner，完成后目录动态插入新行；打开 / 切换项目 = 全屏分步加载遮罩（载入大纲树 → 读取卷章 → 档案 → 恢复会话，逐项点亮），完成后才真正切换并 toast。</li>
      <li><b>启动 · 项目选择页</b>：刚启动时全窗欢迎页（品牌 + 最近项目卡片 + 新建 / 打开其他项目，元素级联浮入）；选择项目后 欢迎页缩放模糊退场 → 分步加载 → 应用<b>固定尺寸浮现再扩大</b>（顶栏 → 侧栏 → 主区 → 审批依次淡入，期间窗口尺寸保持不变，停一拍后整体放大铺满）。控制条「启动页」可随时回放。</li>
      <li><b>恢复「暂停」按钮</b>：生成中发送按钮替换为暂停；审批挂起时发送禁用。现网已移除暂停，此处按需求恢复。</li>
      <li><b>窗口控制</b>：Windows 右侧 最小化 / 最大化·还原 / 关闭（关闭悬停红）；macOS 左侧红绿灯。双击顶栏空白 = 最大化切换。对应 Electron <code>frame:false</code> + <code>-webkit-app-region: drag</code>（顶栏 CSS 已预留）。</li>
      <li><b>窗口尺寸</b>（容器查询，断点 1280 / 1080；<b>最小窗口 1080</b>——Electron minWidth，不做 860 级移动布局）：<code>&gt;1280</code> 侧栏 272 / 审批 376 常驻；<code>≤1280</code> 收窄 238 / 340；<code>≤1080</code>（最小档）审批变右缘覆盖抽屉 + 遮罩。用下方「窗口宽度」模拟（满 / 1440 / 1280 / 1080）。</li>
      <li>主题机制与真实实现一致：<code>&lt;html data-theme&gt;</code> 覆盖 L3 色层，四套主题零组件改动。</li>
    </ul>`;
}

/* ================= 渲染入口 ================= */
function renderChrome() { renderTitlebar(); renderDemoBar(); }
function renderAll() { renderTitlebar(); renderSidebar(); renderMain(); renderInspector(); renderDemoBar(); renderWelcome(); }

/* ================= 交互（事件委托） ================= */
/* 菜单淡出退场：先播 menu-out 再摘 .show / 移除；showMenu 清挂起定时器与 .closing（重开防竞态） */
function hideMenu(el) {
  if (!el || !el.classList.contains("show")) return;
  el.classList.add("closing");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show", "closing"), 160);
}
function showMenu(el) {
  clearTimeout(el._t);
  el.classList.remove("closing");
  el.classList.add("show");
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!e.target.closest("#wsMenu")) hideMenu($("wsMenu"));
  if (!e.target.closest("#notifMenu") && !e.target.closest('[data-act="notifOpen"]')) hideMenu($("notifMenu"));
  const convMenuEl = document.getElementById("convMenu");
  if (convMenuEl && !e.target.closest("#convMenu") && !e.target.closest('[data-act="convMenu"]')) {
    convMenuEl.classList.add("closing");
    clearTimeout(convMenuEl._t);
    convMenuEl._t = setTimeout(() => convMenuEl.remove(), 160);
  }
  if (state.modeMenuOpen && !e.target.closest("#modeRow")) {
    state.modeMenuOpen = false;
    const mm = document.querySelector(".modeMenu");
    if (mm) { mm.classList.add("closing"); setTimeout(updateModeUI, 160); } else updateModeUI();
  }
  /* 提问卡选项点选（.opt 无 data-act；先于 data-act 路由拦截，「其他」输入框点击除外） */
  const askOptEl = e.target instanceof Element ? e.target.closest(".opt[data-qid]") : null;
  if (askOptEl && !askDone && !(e.target instanceof Element && e.target.classList.contains("otherInput"))) {
    const qid = Number(askOptEl.dataset.qid);
    const oi = askOptEl.dataset.oi === "other" ? "other" : Number(askOptEl.dataset.oi);
    const q = ASK_QUESTIONS.find((x) => x.id === qid);
    if (q && !q.open) {
      askSel[qid] = askSel[qid] || { picks: new Set(), other: "" };
      const s = askSel[qid];
      s.picks = s.picks || new Set();
      if (q.multi) {
        if (oi === "other") {
          if (s.picks.has("other")) { s.picks.delete("other"); s.other = ""; }
          else s.picks.add("other");
        } else s.picks.has(oi) ? s.picks.delete(oi) : s.picks.add(oi);
      } else {
        if (oi !== "other" && s.picks.has(oi)) s.picks.clear();
        else {
          s.picks.clear();
          if (oi === "other") s.picks.add("other");
          else s.picks.add(oi);
        }
      }
      renderAskCard();
    }
    return;
  }
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "view":
      state.view = id;
      if (id !== "chat" && state.sidebarCollapsed) state.sidebarCollapsed = false;
      renderTitlebar(); renderSidebar(); renderMain(); renderInspector();
      break;
    case "contentTab": state.contentTab = id; renderSidebar(); renderMain(); break;
    case "unitSel": state.selUnit = id; state.contentTab = "outline"; renderSidebar(); renderMain(); break;
    case "unitSelJump":
      if (e.target.closest(".progRow")) { toast("已定位到大纲：" + unitById[id].title); }
      state.contentTab = "outline"; state.selUnit = id; state.view = "content";
      renderTitlebar(); renderSidebar(); renderMain();
      break;
    case "treeChev": {
      e.stopPropagation();
      const n = unitById[id]; n.open = !n.open; renderSidebar(); break;
    }
    case "treeAll": {
      Object.values(unitById).forEach(n => { n.open = id === "open"; });
      renderSidebar(); break;
    }
    case "volToggle": {
      const v = MANUSCRIPT.find(x => x.id === id); v.open = !v.open; renderSidebar(); break;
    }
    case "chapSel": case "jumpChapter":
      state.contentTab = "manuscript"; state.selChapter = id; state.view = "content";
      renderTitlebar(); renderSidebar(); renderMain(); break;
    case "charSel": state.contentTab = "characters"; state.selChar = id; renderSidebar(); renderMain(); break;
    case "charSelJump":
      state.contentTab = "characters"; state.selChar = id; state.view = "content";
      renderTitlebar(); renderSidebar(); renderMain(); break;
    case "locSelJump":
      state.contentTab = "locations"; state.selLoc = id; state.view = "content";
      renderTitlebar(); renderSidebar(); renderMain(); break;
    case "locSel": state.contentTab = "locations"; state.selLoc = id; renderSidebar(); renderMain(); break;
    case "planSel": state.planSel = id; renderSidebar(); renderMain(); break;
    case "todoDone": {
      const t = TODOS.find(x => x.id === id); t.done = !t.done;
      if (t.done && state.planSel === t.id) state.planSel = "overview";
      renderSidebar(); renderMain(); toast(t.done ? "已完成：" + t.title : "已重新打开：" + t.title); break;
    }
    case "todoGo": {
      const t = TODOS.find(x => x.id === id); const kind = t.action && t.action.kind;
      if (kind === "approval") { state.view = "chat"; openApModal(); toast("已打开审批弹窗"); }
      else if (kind === "location") { state.view = "content"; state.contentTab = "locations"; state.selLoc = "l3"; }
      else if (kind === "chapter") { state.view = "content"; state.contentTab = "manuscript"; state.selChapter = t.action.target; }
      else if (kind === "chat") { state.view = "chat"; }
      renderTitlebar(); renderSidebar(); renderMain(); renderInspector(); renderDemoBar(); break;
    }
    case "modeMenu":
      state.modeMenuOpen = !state.modeMenuOpen; updateModeUI(); break;
    case "modePick": {
      state.modeMenuOpen = false;
      if (id !== state.mode) state.pendingMode = state.pendingMode === id ? null : id;
      updateModeUI(); break;
    }
    case "genCycle": {
      setGen({ generating: "waiting", waiting: "failed", failed: "idle", idle: "generating" }[state.genState]);
      break;
    }
    case "genRetry": setGen("generating"); break;
    case "genPause": setGen("idle"); toast("已暂停生成（演示）"); break;
    case "genSet": setGen(id); break;
    case "queueSet": queueSet(Number(id)); break;
    case "send": sendMsg(); break;
    /* ---- 审批弹窗（阻塞式决策；稍后处理由提示条/状态行/工具行唤回） ---- */
    case "apModalOpen": openApModal(); break;
    case "apLater": apLater(); break;
    case "apSel": state.apSel = Number(id); renderApModal(); break;
    case "apAll": {
      apGroups.filter(g => g.status === "pending").forEach(g => { g.status = "approved"; g._cOpen = false; });
      apFinishIfNeeded();
      renderApModal();
      break;
    }
    case "apReset": {
      apGroups.forEach(g => { g.status = "pending"; g._cOpen = false; g._ctext = ""; delete g._ctextShow; });
      state.apSel = 0;
      if (state.view === "chat") renderMain();
      openApModal();
      toast("已重放：审批到达，弹窗已打开");
      break;
    }
    /* ---- 右栏内容目录 ---- */
    case "dirTab": state.dirTab = id; renderInspector(); break;
    case "dirToggle": {
      const key = el.dataset.ent || null;
      const willOpen = state.expandedDir !== key;
      /* 展开新行时收起上一张详情卡（手风琴单开） */
      if (willOpen && state.expandedDir && state.expandedDir !== key) {
        const prevDetail = document.querySelector(`.dirDetail[data-sum="${state.expandedDir}"]`);
        if (prevDetail) prevDetail.classList.remove("show");
        const prevRow = document.querySelector(`.dirRow[data-ent="${state.expandedDir}"]`);
        if (prevRow) prevRow.classList.remove("open");
      }
      state.expandedDir = willOpen ? key : null;
      const detail = el.nextElementSibling;
      if (detail && detail.classList.contains("dirDetail")) {
        detail.classList.toggle("show", willOpen);
      }
      el.classList.toggle("open", willOpen);
      break;
    }
    case "entLocate": {
      /* 对话流实体标签 → 右栏目录切 tab + 定位高亮 + 展开详情卡 */
      const meta = ENT[el.dataset.type];
      const e = meta.list.find(x => x.id === el.dataset.id);
      if (!e) break;
      state.dirTab = meta.tab;
      state.expandedDir = el.dataset.type + ":" + el.dataset.id;
      state.dirOpen = true;
      renderInspector();
      const row = inspectorEl.querySelector(`.dirRow[data-ent="${el.dataset.type}:${el.dataset.id}"]`);
      if (row) {
        row.scrollIntoView({ block: "nearest", behavior: "smooth" });
        row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
      }
      toast(`已在内容目录定位：${meta.label} › ${e.name}（展开详情卡，可跳完整档案）`);
      break;
    }
    case "mdLink": toast("演示链接：真实实现打开目标地址"); break;
    case "fnGo":
      document.querySelector(".mdFootnotes")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      break;
    case "insClose": state.dirOpen = false; renderInspector(); renderDemoBar(); break;
    case "insToggle":
      state.dirOpen = !state.dirOpen;
      if (state.dirOpen && state.view !== "chat") {
        state.view = "chat"; renderTitlebar(); renderSidebar(); renderMain();
      }
      renderInspector(); renderDemoBar(); break;
    case "apDecide": {
      const g = apGroups.find(x => x.id === Number(el.dataset.group));
      if (!g) break;
      if (id === "approve" || id === "reject") { g.status = id === "approve" ? "approved" : "rejected"; apPulseId = g.id; g._cOpen = false; }
      else if (id === "comment") g._cOpen = !g._cOpen;
      else if (id === "cancel") g._cOpen = false;
      else if (id === "submit") { g.status = "edited"; apPulseId = g.id; g._cOpen = false; g._ctext = ""; }
      apFinishIfNeeded();
      renderApModal();
      break;
    }
    case "apAdd": {
      apCursor += 1;
      apGroups.unshift({ id: ++apSeq, ...structuredClone(AP_TEMPLATES[apCursor % AP_TEMPLATES.length]), status: "pending" });
      apEnterId = apSeq; apCntPop = true;
      state.apSel = 0;
      if (state.view === "chat") renderMain();
      openApModal();
      break;
    }
    case "qToggle": {
      if (askDone) break;
      const qid = Number(id);
      askOpen = askOpen === qid ? -1 : qid;
      renderAskCard();
      break;
    }
    case "askSubmit":
      askDone = true; askOpen = -1;
      renderAskCard();
      toast("回答已提交，生成继续");
      try { const sc = $("chatScroll"); if (sc) sc.scrollTop = sc.scrollHeight; } catch { /* jsdom */ }
      break;
    case "askSkip":
      askSel = {}; askDone = true; askOpen = -1;
      renderAskCard();
      toast("已跳过全部问题——基于现有信息自行决断");
      break;
    case "askReplay":
      askReset();
      break;
    case "sideToggle":
      state.sidebarCollapsed = !state.sidebarCollapsed;
      renderTitlebar(); renderSidebar();
      break;
    case "theme": {
      document.documentElement.classList.add("theming");
      document.documentElement.dataset.theme = id;
      state.theme = id; renderDemoBar(); renderSettings();
      setTimeout(() => document.documentElement.classList.remove("theming"), 400);
      break;
    }
    case "platform": state.platform = id; frame.dataset.platform = id; renderTitlebar(); break;
    case "simw": {
      state.simWidth = id || null;
      stage.classList.toggle("sim", !!state.simWidth);
      frame.style.setProperty("--sim-w", state.simWidth || "100%");
      renderDemoBar(); break;
    }
    case "wMin": toast("已最小化到任务栏 / Dock（演示）"); break;
    case "wMax": state.maximized = !state.maximized; renderTitlebar();
      toast(state.maximized ? "已最大化（演示）" : "已向下还原（演示）"); break;
    case "wClose": $("closedMask").classList.add("show"); break;
    case "reopen": $("closedMask").classList.remove("show"); break;
    case "wsOpen": {
      e.stopPropagation();
      const r = el.getBoundingClientRect();
      renderWsMenu(state.platform === "mac" ? 76 : r.left, r.bottom + 6);
      break;
    }
    case "wsPick":
      /* 切换工作区：分步加载遮罩 → 完成后才切换标题与提示 */
      $("wsMenu").classList.remove("show");
      runLoading(`正在打开《${id}》`, ["载入大纲树", "读取卷章与段落", "角色 / 地点档案", "恢复最近会话"], () => {
        state.ws = id;
        WS_LIST.forEach(w => w.cur = w.name === id);
        renderTitlebar();
        toast("已切换到工作区：" + id);
      });
      break;
    case "wsOpenOther":
      $("wsMenu").classList.remove("show");
      runLoading("正在打开项目…", ["扫描工作区目录", "载入项目档案", "建立索引"], () => {
        toast("演示：此处弹出系统项目选择器");
      });
      break;
    case "welcomePick":
      bootIntoApp(`正在打开《${id}》`, ["载入大纲树", "读取卷章与段落", "角色 / 地点档案", "恢复最近会话"], () => {
        state.ws = id;
        WS_LIST.forEach(x => x.cur = x.name === id);
        renderTitlebar();
        toast("已切换到工作区：" + id);
      });
      break;
    case "welcomeNew":
      bootIntoApp("正在创建项目…", ["初始化工作区", "创建大纲根", "准备会话"], () => {
        toast("已创建新项目（演示）");
      });
      break;
    case "welcomeOther":
      bootIntoApp("正在打开项目…", ["扫描工作区目录", "载入项目档案", "建立索引"], () => {
        toast("演示：此处弹出系统项目选择器");
      });
      break;
    case "welcomeBack":
      state.booted = false;
      renderWelcome();
      break;
    case "notifOpen": {
      e.stopPropagation();
      const m = $("notifMenu");
      if (m.classList.contains("show")) { m.classList.remove("show"); break; }
      $("wsMenu").classList.remove("show");
      const r = el.getBoundingClientRect();
      renderNotifMenu(Math.max(8, r.right - 348), r.bottom + 6);
      break;
    }
    case "notifGo": {
      const n = NOTIFS.find(x => x.id === id);
      if (n) n.unread = false;
      $("notifMenu").classList.remove("show");
      const g = n && n.goto;
      if (n && g) {
        if (g.view === "chat") { state.view = "chat"; openApModal(); }
        else if (g.unit) { state.view = "content"; state.contentTab = "outline"; state.selUnit = g.unit; }
        else if (g.loc) { state.view = "content"; state.contentTab = "locations"; state.selLoc = g.loc; }
        renderTitlebar(); renderSidebar(); renderMain(); renderInspector();
        toast("已读并跳转：" + n.title);
      }
      break;
    }
    case "notifReadAll":
      NOTIFS.forEach(n => { n.unread = false; });
      renderNotifMenu(); renderTitlebar();
      break;
    case "convMenu": {
      e.stopPropagation();
      const ex = document.getElementById("convMenu");
      if (ex) { ex.classList.add("closing"); clearTimeout(ex._t); ex._t = setTimeout(() => ex.remove(), 160); break; }
      const host = el.closest(".subActions");
      if (host) host.insertAdjacentHTML("beforeend", convMenuHTML());
      break;
    }
    case "convAct": {
      const cm = document.getElementById("convMenu");
      if (cm) { cm.classList.add("closing"); clearTimeout(cm._t); cm._t = setTimeout(() => cm.remove(), 160); }
      toast({
        rename: "重命名对话（演示）",
        copy: "已复制最后一条回复（演示）",
        export: "已导出为 Markdown（演示）",
        clear: "已清空上下文，下一轮从新基线开始（演示）",
        del: "删除对话（演示）",
      }[id] || "（演示）");
      break;
    }
    case "convPin":
      state.pinned = !state.pinned;
      toast(state.pinned ? "已置顶《北河旧事》（演示）" : "已取消置顶（演示）");
      break;
    case "settingsOpen": { const m = $("settingsMask"); m.classList.remove("closing"); m.classList.add("show"); renderSettings(); break; }
    case "settingsClose": case "settingsCloseMask":
      if (act === "settingsCloseMask" && e.target.closest('[data-noclose="1"]')) break;
      closeSettings(); break;
    case "settingsTab": state.settingsTab = id; renderSettings(); break;
    case "infoToggle": {
      const p = $("infoPop");
      if (p.classList.contains("show")) hideMenu(p);
      else { renderInfoPop(); showMenu(p); }
      renderDemoBar(); break;
    }
    case "barHide":
      $("demoBar").classList.add("hiddenBar");
      $("barToggle").style.display = "inline-flex";
      break;
    case "barShow":
      $("demoBar").classList.remove("hiddenBar");
      $("barToggle").style.display = "none";
      break;
    case "noop": break;
    case "copyChap": toast("已复制本章正文（演示）"); break;
    case "newConv": {
      /* 新建会话：按钮内 spinner 等待，完成后向目录动态插入新行 */
      if (el.disabled) break;
      el.disabled = true;
      el.innerHTML = `<span class="spinner"></span>正在创建…`;
      setTimeout(() => {
        convSeq += 1;
        CONVS.unshift({ title: "新的创作 " + convSeq, meta: "空会话 · 刚刚", icon: "feather", group: "今天" });
        renderSidebar();
        toast("已开始新的创作");
      }, 900);
      break;
    }
  }
});

/* 顶栏双击 = 最大化切换（Electron 惯例） */
titlebarEl.addEventListener("dblclick", (e) => {
  if (e.target.closest("button") || e.target.closest(".tabs")) return;
  state.maximized = !state.maximized; renderTitlebar();
});

/* ESC：先收审批弹窗（= 稍后处理，提示条常驻唤回），再关设置 */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (state.modalOpen) { apLater(); return; }
  if ($("settingsMask").classList.contains("show")) closeSettings();
});
/* 点审批弹窗遮罩空白 = 稍后处理 */
$("apMask").addEventListener("click", (e) => {
  if (!e.target.closest("[data-noclose='1']")) apLater();
});

/* 右栏拖拽调宽：把手随 renderInspector 重建，监听挂在稳定的 inspector 元素上（>1280 生效，窄档 CSS 隐藏） */
const INSP_MIN = 320, INSP_MAX = 640, INSP_DEFAULT = 376;
function applyInsW(w) {
  state.insW = w;
  frame.style.setProperty("--insp-w", w + "px");
  const tip = $("gripTip");
  if (tip) tip.textContent = w + "px";
}
inspectorEl.addEventListener("pointerdown", (e) => {
  const grip = e.target.closest(".insGrip");
  if (!grip) return;
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  grip.classList.add("dragging");
  document.body.classList.add("resizing");
  const tip = $("gripTip");
  if (tip) tip.classList.add("show");
  const startX = e.clientX, startW = state.insW || INSP_DEFAULT;
  applyInsW(startW);
  const move = (ev) => applyInsW(Math.max(INSP_MIN, Math.min(INSP_MAX, Math.round(startW - (ev.clientX - startX)))));
  const up = () => {
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", up);
    grip.classList.remove("dragging");
    document.body.classList.remove("resizing");
    setTimeout(() => { const t2 = $("gripTip"); if (t2) t2.classList.remove("show"); }, 500);
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
});
inspectorEl.addEventListener("dblclick", (e) => {
  if (!e.target.closest(".insGrip")) return;
  state.insW = null;
  frame.style.removeProperty("--insp-w");
  toast("已复位右栏宽度 " + INSP_DEFAULT + "px");
});

/* 审批意见输入（按组定位） */
document.addEventListener("input", (e) => {
  const ta = e.target;
  if (ta.classList && ta.classList.contains("apComment")) {
    const g = apGroups.find(x => x.id === Number(ta.dataset.gid));
    if (!g) return;
    g._ctext = ta.value;
    const submit = ta.closest(".apCommentInner").querySelector('[data-id="submit"]');
    if (submit) submit.disabled = g._ctext.trim() === "";
  }
  /* 提问卡开放题 / 「其他」输入：只刷 pill 与计数，不整卡重渲染（保输入焦点） */
  if (ta.classList && (ta.classList.contains("openInput") || ta.classList.contains("otherInput"))) {
    const qid = Number(ta.dataset.qid);
    askSel[qid] = askSel[qid] || { picks: new Set(), other: "" };
    const s = askSel[qid];
    if (ta.classList.contains("openInput")) s.text = ta.value;
    else {
      s.other = ta.value;
      if (ta.value.trim() !== "") {
        s.picks = s.picks || new Set();
        s.picks.add("other");
        ta.closest(".opt")?.setAttribute("data-selected", "");
      }
    }
    const n = askAnsweredN();
    const btn = document.querySelector('[data-act="askSubmit"]');
    if (btn) btn.innerHTML = `${ic("check", 12)}提交回答（${n}/${ASK_QUESTIONS.length}）`;
    const cnt = document.querySelector(".askCnt");
    if (cnt && !askDone) cnt.textContent = `${ASK_QUESTIONS.length - n} 问待答`;
    const q = ASK_QUESTIONS.find((x) => x.id === qid);
    const pill = document.querySelector(`#askQItem-${qid} .qPill`);
    if (pill && !askDone) {
      pill.className = `qPill ${askIsAnswered(q) ? "chosen" : "pending"}`;
      pill.textContent = askIsAnswered(q) ? "已选" : "待答";
    }
  }
});

/* 聊天输入 */
function bindChatInput() {
  const ta = $("chatInput");
  if (!ta) return;
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
  });
  ta.addEventListener("input", () => {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
  });
}
function scrollChat(instant) {
  const sc = $("chatScroll");
  if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: instant ? "auto" : "smooth" });
}
let sendSeq = 0;
/* 生成状态切换：原地刷新输入区（状态行 0fr↔1fr、发送↔暂停、禁用态），不重渲染时间线。
   切到 idle 且有排队 → flushQueue 晋升队首并接续开跑（2 条排队会依次执行） */
function setGen(s) {
  state.genState = s;
  if (s === "generating" || s === "waiting") genSec = 0;
  const composer = document.querySelector(".composer");
  if (composer) {
    composer.dataset.gen = s;
    const wrap = composer.querySelector(".statusWrap");
    if (wrap) {
      wrap.dataset.open = String(s !== "idle");
      const inner = wrap.querySelector(".statusInner");
      if (inner) inner.innerHTML = genStatusHTML();
    }
    const send = composer.querySelector(".sendBtn");
    if (send) send.disabled = s === "waiting";
  }
  renderDemoBar();
  if (s === "idle") flushQueue();
}
/* 状态行原地刷新（不动 genSec 计时） */
function refreshGenStatus() {
  const inner = document.querySelector(".composer .statusInner");
  if (inner) inner.innerHTML = genStatusHTML();
}
/* 排队幽灵项 HTML（data-at 供等待秒数计时，跨重渲染稳定）。
   live=仅即时插入带内联入场动画——重渲染缓存不带（.chatInner.fresh 抑制下
   静态项不重播，内联动画会盖过抑制导致整列重播） */
function ghostHTML(q, { live = false } = {}) {
  const anim = live ? ' style="animation: ghost-in var(--duration-base) var(--ease-out)"' : "";
  return `<div class="msgUser ghost" data-at="${q.at}"${anim}><span class="ghostBadge">${ic("clock", 10)}排队中 <span class="qSec">0s</span></span>${esc(q.text)}</div>`;
}
/* 生成/审批中发送 → 入队：幽灵项即时回显（时间线末尾）+ 状态行计数 */
function enqueueMsg(text) {
  const q = { text, at: Date.now(), liveIdx: liveMsgs.length };
  queuedMsgs.push(q);
  liveMsgs.push(ghostHTML(q));
  const live = $("liveMsgs");
  if (live) live.insertAdjacentHTML("beforeend", ghostHTML(q, { live: true }));
  refreshGenStatus();
  renderDemoBar();
  scrollChat();
}
/* run 收口 → 晋升队首幽灵项为正式气泡（原地，位置不动）并接续开跑 */
function flushQueue() {
  if (queuedMsgs.length === 0) return;
  const q = queuedMsgs.shift();
  const ghostEl = document.querySelector("#liveMsgs .msgUser.ghost");
  if (ghostEl) {
    ghostEl.classList.remove("ghost");
    ghostEl.classList.add("promoted");
    /* 内联换 ghost-promote：类规则的 animation 被 .chatInner.fresh 抑制规则盖过 */
    ghostEl.style.animation = "ghost-promote var(--duration-base) var(--ease-out)";
    ghostEl.querySelector(".ghostBadge")?.remove();
  }
  if (q.liveIdx !== undefined) liveMsgs[q.liveIdx] = `<div class="msgUser">${esc(q.text)}</div>`;
  refreshGenStatus();
  renderDemoBar();
  demoReply();
}
/* 排队示例（控制条）：清空后压入 n 条示例（空闲态自动先进入生成，幽灵项才有语境） */
function queueSet(n) {
  clearQueue();
  if (state.genState === "idle" || state.genState === "failed") setGen("generating");
  if (n >= 1) enqueueMsg("排队 1：把第三章的伏笔清单整理出来，标出哪些还没回收。");
  if (n >= 2) enqueueMsg("排队 2：顺带核对雾角灯塔的档案——现状字段还空着。");
}
function clearQueue() {
  for (const q of queuedMsgs) {
    if (q.liveIdx !== undefined) liveMsgs[q.liveIdx] = "";
  }
  queuedMsgs.length = 0;
  document.querySelectorAll("#liveMsgs .msgUser.ghost").forEach((el) => el.remove());
  refreshGenStatus();
  renderDemoBar();
}
function sendMsg() {
  const ta = $("chatInput");
  const text = (ta ? ta.value : "").trim();
  if (!text) { toast("先写点什么吧（演示）"); return; }
  if (ta) { ta.value = ""; ta.style.height = "auto"; }
  // 生成/审批中发送 → 排队（幽灵项即时回显，不再吞掉输入）
  if (state.genState === "generating" || state.genState === "waiting") {
    enqueueMsg(text);
    toast(`已排队（第 ${queuedMsgs.length} 条），当前回复完成后执行`);
    return;
  }
  if (state.pendingMode && state.pendingMode !== state.mode) {
    state.mode = state.pendingMode; state.pendingMode = null; updateModeUI();
  }
  const html = `<div class="msgUser">${esc(text)}</div>`;
  liveMsgs.push(html);
  const live = $("liveMsgs");
  /* 插入项带内联入场（盖过 .chatInner.fresh 抑制；缓存不带，重渲染不重播） */
  if (live) live.insertAdjacentHTML("beforeend", `<div class="msgUser" style="animation: msg-enter var(--duration-base) var(--ease-out)">${esc(text)}</div>`);
  demoReply();
}
/* 发送后的演示回复（450ms 后收口；收口 → setGen("idle") → flushQueue 接续排队） */
function demoReply() {
  setGen("generating");
  scrollChat();
  const seq = ++sendSeq;
  setTimeout(() => {
    const reply = `
      <div class="msgAssistant">
        <div class="msgHead">
          <span class="avatar assistant">${ic("feather", 12, 2)}</span>
          <b>NovelAI</b>
          <span class="mMeta">刚刚</span>
          <span class="chip faint">设计</span>
        </div>
        <div class="toolGroup">
          <div class="toolLine"><span class="toolDone">${ic("check", 12, 2.2)}上下文读取 · 大纲与档案</span></div>
        </div>
        <div class="mdBody"><p>收到（演示回复 ${seq}）。我会先核对大纲与既有设定，再给出修订建议与草稿；正式环境里这里会流式输出正文。</p></div>
      </div>`;
    liveMsgs.push(reply);
    const live2 = $("liveMsgs");
    /* 插入项带内联入场（同 sendMsg：缓存不带，重渲染不重播） */
    if (live2) live2.insertAdjacentHTML("beforeend", reply.replace('<div class="msgAssistant">', '<div class="msgAssistant" style="animation: msg-enter var(--duration-base) var(--ease-out)">'));
    setGen("idle");
    scrollChat();
  }, 450);
}

/* ================= 计时器 ================= */
let toolSec = 12;
setInterval(() => {
  toolSec += 1;
  const el = $("toolSecTick");
  if (el) el.textContent = toolSec + "s";
}, 1000);
let genSec = 0;
setInterval(() => {
  if (state.genState === "generating" || state.genState === "waiting") genSec += 1;
  else genSec = 0;
  const el = $("genSec");
  if (el) el.textContent = genSec + "s";
}, 1000);
// 发送后的演示工具行秒数跳动
setInterval(() => {
  document.querySelectorAll("#liveMsgs .toolSec").forEach(el => {
    const m = el.textContent.match(/^(\d+)s$/);
    if (m) el.textContent = (Number(m[1]) + 1) + "s";
  });
}, 1000);
// 排队幽灵项等待秒数（data-at 起算，跨重渲染稳定）
setInterval(() => {
  document.querySelectorAll("#liveMsgs .msgUser.ghost").forEach(el => {
    const badge = el.querySelector(".qSec");
    const at = Number(el.dataset.at || 0);
    if (badge && at > 0) badge.textContent = Math.max(0, Math.round((Date.now() - at) / 1000)) + "s";
  });
}, 1000);

/* ================= 容器宽度断点联动 =================
   CSS 容器查询负责布局（≤1280 收窄 / ≤1080 审批覆盖抽屉）；
   ResizeObserver 只同步 JS 态：≤1080 时审批抽屉遮罩。
   应用最小窗口 1080（Electron minWidth），不提供更窄档。 */
if (typeof ResizeObserver !== "undefined") {
  let roInit = false;
  const ro = new ResizeObserver((entries) => {
    const mid = entries[0].contentRect.width <= 1080;
    if (!roInit) { state.vpMid = mid; roInit = true; updateScrims(); return; }
    if (mid === state.vpMid) return;
    state.vpMid = mid;
    updateScrims();
  });
  ro.observe(frame);
}

/* ================= 启动 ================= */
renderAll();
renderInfoPop();
</script>
