<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审批对话流重设计 · 悬浮在聊天框上方</title>
<style>
  :root {
    --bg:            oklch(97.9% 0.003 85);
    --surface:       oklch(99.8% 0.0015 85);
    --surface-2:     oklch(96.2% 0.004 82);
    --fg:            oklch(30% 0.009 46);
    --muted:         oklch(52% 0.009 54);
    --faint:         oklch(60% 0.009 58);
    --border:        oklch(92.4% 0.003 82);
    --border-strong: oklch(84% 0.008 72);
    --accent:        oklch(55% 0.072 42);
    --accent-ink:    oklch(47% 0.062 41);
    --success:       oklch(52% 0.07 156);
    --warn:          oklch(59% 0.07 80);
    --warn-bg:       oklch(97.1% 0.011 86);
    --danger:        oklch(54% 0.068 32);
    --info:          oklch(54% 0.05 235);
    --shadow-1: 0 1px 2px rgba(40, 22, 10, 0.04), 0 8px 24px rgba(40, 22, 10, 0.045);
    --shadow-2: 0 2px 6px rgba(40, 22, 10, 0.06), 0 16px 48px rgba(40, 22, 10, 0.1);
    --font-ui: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --font-body: "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 780px at 14% -8%, color-mix(in oklab, var(--accent) 5%, transparent), transparent 62%), var(--bg);
    color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden;
  }
  .app { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 22px;
    border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--surface) 82%, transparent);
    backdrop-filter: blur(8px);
  }
  .topbar .t { font-weight: 800; font-size: 14px; }
  .topbar .kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; color: var(--faint); }

  /* 时间线（消息流不再有审批卡） */
  .flow { flex: 1; overflow-y: auto; padding: 26px 26px 8px; display: flex; flex-direction: column; gap: 16px; max-width: 860px; margin: 0 auto; width: 100%; }
  .msg { display: flex; gap: 11px; align-items: flex-start; }
  .msg .avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
  .msg.assistant .avatar { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--border)); color: var(--accent-ink); }
  .msg.user { justify-content: flex-end; }
  .msg.user .avatar { order: 2; background: color-mix(in oklab, var(--info) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--info) 26%, var(--border)); color: var(--info); }
  .msg .bubble { max-width: 560px; font-size: 13.5px; padding: 9px 14px; border-radius: 4px 14px 14px 14px; box-shadow: var(--shadow-1); }
  .msg.assistant .bubble { background: color-mix(in oklab, var(--accent) 5%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 16%, var(--border)); }
  .msg.user .bubble { border-radius: 14px 4px 14px 14px; background: color-mix(in oklab, var(--info) 7%, var(--surface)); border: 1px solid color-mix(in oklab, var(--info) 18%, var(--border)); }

  /* 悬浮审批区：固定在聊天框上方、独立于对话流 */
  .dock { flex: none; padding: 6px 26px 0; }
  .dock-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  .approval {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-2);
    overflow: hidden; animation: pop .16s ease-out;
  }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .approval .row1 { display: flex; align-items: center; gap: 10px; padding: 11px 14px 7px; }
  .pending-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in oklab, var(--warn) 20%, transparent); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .approval .h { font-size: 13px; font-weight: 800; }
  .approval .count { font-size: 10.5px; font-weight: 800; color: var(--faint); background: var(--surface-2); border: 1px solid var(--border); padding: 0 7px; border-radius: 999px; }
  .approval .meta { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
  .approval .ops { list-style: none; padding: 3px 14px; display: flex; flex-direction: column; gap: 3px; }
  .approval .op { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .opChip { flex: none; font-size: 9.5px; font-weight: 800; padding: 0 7px; border-radius: 999px; }
  .opChip.add { color: var(--success); background: color-mix(in oklab, var(--success) 12%, var(--surface)); border: 1px solid color-mix(in oklab, var(--success) 36%, transparent); }
  .opChip.edit { color: var(--warn); background: color-mix(in oklab, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warn) 36%, transparent); }
  .opChip.del { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, var(--surface)); border: 1px solid color-mix(in oklab, var(--danger) 36%, transparent); }
  .approval .foot { display: flex; align-items: center; gap: 8px; padding: 9px 14px 11px; border-top: 1px solid var(--border); margin-top: 6px; }
  .btn { font: inherit; font-size: 12.5px; font-weight: 700; padding: 7px 16px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
  .btn.pass { background: var(--accent); color: oklch(99% 0 0); box-shadow: var(--shadow-1); }
  .btn.reject { background: transparent; color: var(--danger); border-color: color-mix(in oklab, var(--danger) 32%, var(--border)); }
  .btn.detail { background: transparent; color: var(--accent-ink); border-color: var(--border-strong); }
  .approval .actions { display: flex; gap: 8px; margin-left: auto; }

  /* 已处理一行：折叠残留记录（可选开关） */
  .trace { display: flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--border-strong); color: var(--muted); font-size: 12.5px; animation: pop .16s ease-out; }
  .trace .dot { width: 7px; height: 7px; border-radius: 50%; }
  .trace .dot.approved { background: var(--success); }
  .trace .dot.rejected { background: var(--danger); }
  .trace .st { font-weight: 800; }
  .trace .t { color: var(--fg); font-weight: 700; }
  .trace .tm { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--faint); }

  /* 聊天框 */
  .composer { flex: none; padding: 12px 26px 22px; }
  .composer-inner { max-width: 860px; margin: 0 auto; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-2); padding: 12px 14px; display: flex; align-items: flex-end; gap: 10px; }
  .box .ph { flex: 1; color: var(--faint); font-size: 13px; padding: 4px 2px; }
  .box .send { flex: none; font: inherit; font-size: 13px; font-weight: 700; padding: 8px 20px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); color: var(--faint); cursor: default; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 10px; }
  .toolbar button { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
  .toolbar button.on { background: color-mix(in oklab, var(--accent) 10%, var(--surface)); border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); color: var(--accent-ink); }
  .toolbar .sep { flex: 1; }
  .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="t">白鹭旅馆 · 第三章</span>
    <span class="kicker">审批悬浮在聊天框上方 · 独立于对话流</span>
  </div>

  <!-- 消息流：不再出现审批卡 -->
  <div class="flow">
    <div class="msg assistant">
      <div class="avatar">N</div>
      <div class="bubble">我来起草第三章的新角色与一处大纲调整。</div>
    </div>
    <div class="msg user">
      <div class="avatar">我</div>
      <div class="bubble">可以，先给我看下要改什么。</div>
    </div>
    <div class="msg assistant">
      <div class="avatar">N</div>
      <div class="bubble">好的。需要新增角色「林夏」（含别名）并在「灯塔调查线」下挂一个新场景节点。确认后我落库。</div>
    </div>
  </div>

  <!-- 悬浮审批区 + 聊天框 -->
  <div class="dock">
    <div class="dock-inner" id="dock"></div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <div class="toolbar">
        <button id="addOne">＋ 再来一条审批</button>
        <button id="addTwo" style="display:none">＋ 又来一条</button>
        <span class="sep"></span>
        <label><input type="checkbox" id="traceOpt" checked> 已处理后留一行记录</label>
      </div>
      <div class="box">
        <div class="ph">输入创作指令，例如：让林夏在旧船坞发现货单…</div>
        <div class="send">发送</div>
      </div>
    </div>
  </div>

</div>

<script>
  const dock = document.getElementById("dock");
  const traceOpt = document.getElementById("traceOpt");
  let seq = 0;
  let pendingCount = 0;

  const SAMPLES = [
    { title: "新增角色：林夏", tool: "NovelCharacterWrite", time: "09:12", ops: [["add","新增","角色","林夏"], ["add","新增","别名","夏、夏夏"]] },
    { title: "新增大纲：追踪错误目标", tool: "NovelOutlineWrite", time: "09:12", ops: [["add","新增","大纲单元","追踪错误目标（挂 灯塔调查线）"]] },
    { title: "编辑角色：林夏", tool: "NovelCharacterEdit", time: "09:14", ops: [["edit","修改","简介","暂不点破船坞线索"], ["add","新增","作者注记","第三卷少说多做"]] },
  ];

  addApproval(0);
  addApproval(1);

  document.getElementById("addOne").addEventListener("click", () => { addApproval(1); });
  document.getElementById("addTwo").addEventListener("click", () => { addApproval(2); });

  function addApproval(sampleIndex) {
    seq += 1;
    const s = SAMPLES[sampleIndex % SAMPLES.length];
    pendingCount += 1;

    const card = document.createElement("div");
    card.className = "approval";
    card.dataset.id = seq;
    card.innerHTML = `
      <div class="row1">
        <span class="pending-dot"></span>
        <span class="h">${s.title}</span>
        <span class="count">待审批</span>
        <span class="meta">${s.tool} · ${s.time}</span>
      </div>
      <ul class="ops">
        ${s.ops.map((o) => `<li class="op"><span class="opChip ${o[0]}">${o[1]}</span><span>${o[2]} <b>${o[3]}</b></span></li>`).join("")}
      </ul>
      <div class="foot">
        <button class="btn detail">详情 →</button>
        <div class="actions">
          <button class="btn reject">驳回</button>
          <button class="btn pass">通过</button>
        </div>
      </div>`;
    dock.appendChild(card);

    const resolve = (decision) => {
      pendingCount -= 1;
      card.remove();
      if (traceOpt.checked) {
        const trace = document.createElement("div");
        trace.className = "trace";
        trace.innerHTML = `
          <span class="dot ${decision}"></span>
          <span class="st">${decision === "approved" ? "已通过" : "已驳回"}</span>
          <span class="t">${s.title}</span>
          <span class="tm">09:13</span>`;
        dock.appendChild(trace);
      }
      maybeEnableSend();
    };
    card.querySelector(".btn.pass").addEventListener("click", () => resolve("approved"));
    card.querySelector(".btn.reject").addEventListener("click", () => resolve("rejected"));
    card.querySelector(".btn.detail").addEventListener("click", () => {
      alert("打开右侧审批面板查看完整参数/变更详情");
    });

    maybeEnableSend();
  }

  const send = document.querySelector(".box .send");
  function maybeEnableSend() {
    if (pendingCount <= 0) {
      send.style.background = "var(--accent)";
      send.style.color = "oklch(99% 0 0)";
      send.textContent = "发送";
    } else {
      send.style.background = "var(--surface-2)";
      send.style.color = "var(--faint)";
      send.textContent = "等待审批…";
    }
  }
</script>
</body></html>
