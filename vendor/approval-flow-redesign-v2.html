<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审批悬浮层 · 对齐最新 main 布局</title>
<style>
  :root {
    --bg:            oklch(97.9% 0.003 85);
    --surface:       oklch(99.8% 0.0015 85);
    --surface-2:     oklch(96.2% 0.004 82);
    --fg:            oklch(30% 0.009 46);
    --muted:         oklch(52% 0.009 54);
    --faint:         oklch(60% 0.009 58);
    --border:        oklch(92.4% 0.003 82);
    --border-strong: oklch(84% 0.008 72);
    --accent:        oklch(55% 0.072 42);
    --accent-ink:    oklch(47% 0.062 41);
    --success:       oklch(52% 0.07 156);
    --warn:          oklch(59% 0.07 80);
    --danger:        oklch(54% 0.068 32);
    --info:          oklch(54% 0.05 235);
    --shadow-1: 0 1px 2px rgba(40, 22, 10, 0.04), 0 8px 24px rgba(40, 22, 10, 0.045);
    --font-ui: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --font-body: "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
  .app { height: 100vh; display: flex; flex-direction: column; }

  /* 顶栏（对齐 main：Novel + workspace + 右侧 计划/审批） */
  .topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .hamburger { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .hamburger svg { width: 15px; height: 15px; }
  .wordmark { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
  .ws { font-size: 13px; color: var(--muted); border: none; background: none; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .ws:hover { background: var(--surface-2); }
  .spacer { flex: 1; }
  .tb-action { font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--border-strong); padding: 5px 11px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .tb-action.on { color: var(--accent-ink); border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); background: color-mix(in oklab, var(--accent) 9%, var(--surface)); }
  .badge { font-size: 9.5px; font-weight: 800; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: oklch(99% 0 0); display: inline-flex; align-items: center; justify-content: center; }

  /* 消息流 */
  .flow { flex: 1; overflow-y: auto; padding: 28px 26px 10px; display: flex; flex-direction: column; gap: 17px; max-width: 860px; margin: 0 auto; width: 100%; }
  .msg { display: flex; gap: 11px; align-items: flex-start; }
  .msg .avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
  .msg.assistant .avatar { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--border)); color: var(--accent-ink); }
  .msg.user { justify-content: flex-end; }
  .msg.user .avatar { order: 2; background: color-mix(in oklab, var(--info) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--info) 26%, var(--border)); color: var(--info); }
  .msg .bubble { max-width: 560px; font-size: 13.5px; padding: 9px 14px; border-radius: 4px 14px 14px 14px; box-shadow: var(--shadow-1); }
  .msg.assistant .bubble { background: color-mix(in oklab, var(--accent) 5%, var(--surface)); border: 1px solid color-mix(in oklab, var(--accent) 16%, var(--border)); }
  .msg.user .bubble { border-radius: 14px 4px 14px 14px; background: color-mix(in oklab, var(--info) 7%, var(--surface)); border: 1px solid color-mix(in oklab, var(--info) 18%, var(--border)); }

  /* 悬浮审批层：毛玻璃、独立于对话流 */
  .dock { flex: none; padding: 8px 26px 0; }
  .dock-inner { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }

  .approval {
    border-radius: 14px;
    background: linear-gradient(150deg, color-mix(in oklab, var(--surface) 72%, transparent), color-mix(in oklab, var(--surface) 44%, transparent));
    backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
    border: 1px solid color-mix(in oklab, var(--border) 72%, transparent);
    box-shadow: 0 2px 8px rgba(40,22,10,.07), 0 18px 50px rgba(40,22,10,.12), 0 0 0 1px rgba(255,255,255,.4) inset;
    overflow: hidden; animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: translateY(8px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
  .a-row { display: flex; align-items: center; gap: 8px; padding: 10px 13px 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in oklab, var(--warn) 20%, transparent); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .lbl { font-size: 9.5px; font-weight: 800; letter-spacing: .08em; color: oklch(52% 0.06 74); }
  .a-title { font-size: 13px; font-weight: 800; }
  .a-time { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); }
  .a-brief { padding: 1px 13px 7px; font-size: 12px; color: var(--muted); }
  .a-brief b { color: var(--fg); font-weight: 700; }
  .a-brief .sep { color: var(--faint); margin: 0 6px; }
  .a-acts { display: flex; align-items: center; gap: 2px; padding: 4px 8px 9px; }
  .jump { margin-right: auto; display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 11px; font-weight: 700; color: var(--accent-ink); background: color-mix(in oklab, var(--accent) 7%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 20%, transparent); padding: 4px 9px; border-radius: 7px; cursor: pointer; }
  .jump svg { width: 10px; height: 10px; }
  .icon-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; transition: transform .1s; }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 13px; height: 13px; }
  .icon-btn.pass { color: var(--success); border-color: color-mix(in oklab, var(--success) 26%, var(--border)); background: color-mix(in oklab, var(--success) 7%, transparent); }
  .icon-btn.reject { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 26%, var(--border)); background: color-mix(in oklab, var(--danger) 7%, transparent); }

  /* 已处理记录行 */
  .trace {
    display: flex; align-items: center; gap: 9px; padding: 7px 13px; border-radius: 10px;
    background: linear-gradient(150deg, color-mix(in oklab, var(--surface) 55%, transparent), color-mix(in oklab, var(--surface) 30%, transparent));
    backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4);
    border: 1px dashed color-mix(in oklab, var(--border-strong) 65%, transparent);
    color: var(--muted); font-size: 12px; animation: pop .16s ease-out;
  }
  .trace .st { font-weight: 800; }
  .trace .st.approved { color: var(--success); }
  .trace .st.rejected { color: var(--danger); }
  .trace .t { color: var(--fg); font-weight: 700; }
  .trace .tm { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); }

  /* 聊天框 */
  .composer { flex: none; padding: 13px 26px 22px; }
  .composer-inner { max-width: 860px; margin: 0 auto; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 9px; }
  .toolbar button { font: inherit; font-size: 11.5px; padding: 4px 11px; border-radius: 7px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
  .toolbar .sep { flex: 1; }
  .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-1); padding: 11px 13px; display: flex; align-items: flex-end; gap: 10px; }
  .box .ph { flex: 1; color: var(--faint); font-size: 13px; padding: 4px 2px; }
  .box .send { flex: none; font: inherit; font-size: 13px; font-weight: 700; padding: 8px 20px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); color: var(--faint); cursor: default; }
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏：Novel + workspace + 审批按钮（徽标 + 选中态） -->
  <div class="topbar">
    <button class="hamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <span class="wordmark">Novel</span>
    <button class="ws">白鹭旅馆</button>
    <span class="spacer"></span>
    <button class="tb-action" id="planBtn">计划</button>
    <button class="tb-action" id="approvalBtn"><span id="badgeCount">2</span> 审批</button>
  </div>

  <!-- 消息流（无审批元素） -->
  <div class="flow">
    <div class="msg assistant"><div class="avatar">N</div><div class="bubble">我来起草第三章的新角色与一处大纲调整。</div></div>
    <div class="msg user"><div class="avatar">我</div><div class="bubble">可以，先给我看下要改什么。</div></div>
    <div class="msg assistant"><div class="avatar">N</div><div class="bubble">好的。需要新增角色「林夏」（含别名）并在「灯塔调查线」下挂一个新场景节点。确认后我落库。</div></div>
  </div>

  <!-- 悬浮审批层 -->
  <div class="dock"><div class="dock-inner" id="dock"></div></div>

  <div class="composer">
    <div class="composer-inner">
      <div class="toolbar">
        <button id="addMore">＋ 再来一条审批</button>
        <span class="sep"></span>
        <label><input type="checkbox" id="traceOpt" checked> 已处理后留一行记录</label>
      </div>
      <div class="box">
        <div class="ph">输入创作指令，例如：让林夏在旧船坞发现货单…</div>
        <div class="send">发送</div>
      </div>
    </div>
  </div>

</div>

<script>
  const dock = document.getElementById("dock");
  const traceOpt = document.getElementById("traceOpt");
  const badgeCount = document.getElementById("badgeCount");
  const approvalBtn = document.getElementById("approvalBtn");
  let seq = 0;
  let pendingCount = 0;

  const SAMPLES = [
    { title: "新增角色：林夏", tool: "NovelCharacterWrite", time: "09:12", brief: "新增角色 <b>林夏</b>，别名 夏、夏夏" },
    { title: "新增大纲节点", tool: "NovelOutlineWrite", time: "09:12", brief: "「灯塔调查线」下挂场景 <b>追踪错误目标</b>" },
    { title: "编辑角色：林夏", tool: "NovelCharacterEdit", time: "09:14", brief: "修改简介 ＋ 新增作者注记" },
  ];

  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>';
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  addApproval(0);
  addApproval(1);

  document.getElementById("addMore").addEventListener("click", () => addApproval(seq % SAMPLES.length));
  approvalBtn.addEventListener("click", () => {
    approvalBtn.classList.toggle("on");
    alert("右上角审批按钮 toggle：打开/收起右侧审核面板");
  });

  function addApproval(sampleIndex) {
    seq += 1;
    const s = SAMPLES[sampleIndex % SAMPLES.length];
    pendingCount += 1;

    const card = document.createElement("div");
    card.className = "approval";
    card.innerHTML = `
      <div class="a-row">
        <span class="dot"></span>
        <span class="lbl">待审批</span>
        <span class="a-title">${s.title}</span>
        <span class="a-time">${s.tool} · ${s.time}</span>
      </div>
      <div class="a-brief">${s.brief}</div>
      <div class="a-acts">
        <button class="jump" title="打开审核详细面板">审核详情 ${ARROW}</button>
        <button class="icon-btn reject" title="驳回">${X}</button>
        <button class="icon-btn pass" title="通过">${CHECK}</button>
      </div>`;
    dock.appendChild(card);

    card.querySelector(".jump").addEventListener("click", () => {
      alert("跳转到审核详细面板（右侧）：完整参数 / 变更 diff / 上下文");
    });
    card.querySelector(".icon-btn.pass").addEventListener("click", () => resolve(card, s, "approved"));
    card.querySelector(".icon-btn.reject").addEventListener("click", () => resolve(card, s, "rejected"));

    sync();
  }

  function resolve(card, s, decision) {
    pendingCount -= 1;
    card.remove();
    if (traceOpt.checked) {
      const trace = document.createElement("div");
      trace.className = "trace";
      trace.innerHTML = `<span class="st ${decision}">${decision === "approved" ? "已通过" : "已驳回"}</span><span class="t">${s.title}</span><span class="tm">09:13</span>`;
      dock.appendChild(trace);
    }
    sync();
  }

  const send = document.querySelector(".box .send");
  function sync() {
    badgeCount.textContent = pendingCount;
    if (pendingCount > 0) approvalBtn.classList.add("on");
    else approvalBtn.classList.remove("on");
    if (pendingCount <= 0) {
      send.style.background = "var(--accent)"; send.style.color = "oklch(99% 0 0)"; send.textContent = "发送";
    } else {
      send.style.background = "var(--surface-2)"; send.style.color = "var(--faint)"; send.textContent = "等待审批…";
    }
  }
</script>
</body></html>
