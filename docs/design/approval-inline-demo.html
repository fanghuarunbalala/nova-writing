<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审批交互方案 B · 流内阻塞卡 + 右栏挂起清单</title>
<style>
  /* ============================================================
     审批交互对比 demo · 方案 B：流内阻塞卡 + 右栏挂起清单（对照方案 A 弹窗）
     【状态】落选留档（选型：方案 A 弹窗，见 PRD 决议 7）；不再维护。
     审批卡内联在对话流末尾（紧跟引发它的轮次）：原文 / 参数 / exit 设计
     草稿全文都在 760px 宽度内就地阅读、就地决策；首项展开、其余折叠，
     处理完原地留痕（不消失），时间线即审计记录。
     对弹窗方案的核心差异：不劫持焦点——决策前可自由上翻上下文，
     卡片滚出视口时由 右栏挂起清单（逐项状态 + 点击滚动定位回卡片）兜底。
     另含：实体标签 <character_沈砚> 点击 → 标签附近浮层预览卡；
     markdown 全格式渲染样例消息；右栏拖拽调宽（320–640，双击复位）。
     主题 token 对齐 app-redesign-demo.html（四主题零组件改动）。
     ============================================================ */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "HarmonyOS Sans SC", "MiSans",
      "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHea UI", "Microsoft YaHei",
      system-ui, sans-serif;
    --font-body: "Iowan Old Style", "Palatino Linotype",
      "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong",
      "SimSun", Georgia, serif;
    --font-kai: "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

    --fs-chat: 15.5px;
    --fs-12: 12px; --fs-13: 13px; --fs-12-5: 12.5px; --fs-11: 11px;
    --fs-10-5: 10.5px;
    --fw-regular: 400; --fw-medium: 550; --fw-semibold: 650; --fw-bold: 700;

    --radius-sm: 6px; --radius-md: 9px; --radius-lg: 14px; --radius-pill: 999px;
    --duration-fast: 0.15s; --duration-base: 0.22s;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    /* 宣纸白（默认） */
    --color-bg:            oklch(97.9% 0.003 85);
    --color-surface:       oklch(99.8% 0.0015 85);
    --color-surface-2:     oklch(96.2% 0.004 82);
    --color-fg:            oklch(30% 0.009 46);
    --color-muted:         oklch(52% 0.009 54);
    --color-faint:         oklch(60% 0.009 58);
    --color-border:        oklch(92.4% 0.003 82);
    --color-border-strong: oklch(86.4% 0.006 72);
    --color-orange:        oklch(73% 0.068 60);
    --color-accent:        oklch(55% 0.072 42);
    --color-red:           oklch(58% 0.075 32);
    --color-accent-ink:    oklch(47% 0.062 41);
    --color-success:       oklch(52% 0.07 156);
    --color-success-bg:    oklch(97.2% 0.011 156);
    --color-warn:          oklch(59% 0.07 80);
    --color-warn-bg:       oklch(97.1% 0.011 86);
    --color-danger:        oklch(54% 0.068 32);
    --color-danger-bg:     oklch(97.1% 0.009 33);
    --color-info:          oklch(54% 0.05 235);
    --color-info-bg:       oklch(97.2% 0.007 236);
    --color-on-accent:     #fff;

    --color-accent-9:   color-mix(in oklab, var(--color-accent) 9%, var(--color-surface));
    --color-accent-8-t: color-mix(in oklab, var(--color-accent) 8%, transparent);
    --color-accent-11:  color-mix(in oklab, var(--color-accent) 11%, var(--color-surface));
    --color-accent-45:  color-mix(in oklab, var(--color-accent) 45%, transparent);
    --color-danger-12:  color-mix(in oklab, var(--color-danger) 12%, var(--color-surface));
    --color-chrome-bg:  color-mix(in oklab, var(--color-surface) 82%, transparent);
    --color-focus-ring: color-mix(in oklab, var(--color-accent) 42%, transparent);
    --color-scrollbar-thumb: color-mix(in oklab, var(--color-fg) 15%, transparent);
    --color-warn-40:    color-mix(in oklab, var(--color-warn) 40%, transparent);

    --grad-accent: linear-gradient(105deg,
      var(--color-orange) 0%, var(--color-accent) 48%, var(--color-red) 100%);

    --shadow-1: 0 1px 2px rgba(40, 22, 10, 0.04), 0 8px 24px rgba(40, 22, 10, 0.045);
    --shadow-2: 0 2px 4px rgba(40, 22, 10, 0.05), 0 16px 40px rgba(40, 22, 10, 0.11);
    --shadow-xs: 0 1px 3px rgba(20, 12, 6, 0.08);

    --insp-w: 340px;
  }
  /* ============ 墨夜 ============ */
  [data-theme="ink"] {
    --color-bg:            oklch(21% 0.005 80);
    --color-surface:       oklch(25.5% 0.006 80);
    --color-surface-2:     oklch(28.5% 0.007 78);
    --color-fg:            oklch(89% 0.006 85);
    --color-muted:         oklch(70% 0.008 80);
    --color-faint:         oklch(59% 0.007 80);
    --color-border:        oklch(31% 0.007 80);
    --color-border-strong: oklch(40% 0.01 78);
    --color-orange:        oklch(77% 0.095 62);
    --color-accent:        oklch(68% 0.115 42);
    --color-red:           oklch(66% 0.115 30);
    --color-accent-ink:    oklch(78% 0.09 45);
    --color-success:       oklch(72% 0.095 156);
    --color-success-bg:    oklch(29% 0.032 156);
    --color-warn:          oklch(75% 0.1 80);
    --color-warn-bg:       oklch(29% 0.034 85);
    --color-danger:        oklch(67% 0.1 32);
    --color-danger-bg:     oklch(28% 0.03 33);
    --color-info:          oklch(70% 0.075 235);
    --color-info-bg:       oklch(28% 0.024 236);
    --color-on-accent:     oklch(24% 0.03 42);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.32), 0 16px 40px rgba(0, 0, 0, 0.48);
    --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.35);
  }
  /* ============ 黛青 ============ */
  [data-theme="celadon"] {
    --color-bg:            oklch(20% 0.013 235);
    --color-surface:       oklch(24% 0.015 235);
    --color-surface-2:     oklch(27% 0.017 232);
    --color-fg:            oklch(89% 0.009 225);
    --color-muted:         oklch(69% 0.013 230);
    --color-faint:         oklch(58% 0.012 230);
    --color-border:        oklch(30% 0.015 235);
    --color-border-strong: oklch(38% 0.019 232);
    --color-orange:        oklch(78% 0.07 190);
    --color-accent:        oklch(75% 0.1 195);
    --color-red:           oklch(68% 0.11 265);
    --color-accent-ink:    oklch(84% 0.075 205);
    --color-success:       oklch(72% 0.095 158);
    --color-success-bg:    oklch(28% 0.032 158);
    --color-warn:          oklch(76% 0.1 90);
    --color-warn-bg:       oklch(28% 0.032 88);
    --color-danger:        oklch(68% 0.11 25);
    --color-danger-bg:     oklch(28% 0.03 25);
    --color-info:          oklch(72% 0.08 240);
    --color-info-bg:       oklch(28% 0.028 240);
    --color-on-accent:     oklch(20% 0.04 230);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.32);
    --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.32), 0 16px 40px rgba(0, 0, 0, 0.5);
    --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.36);
  }
  /* ============ 雪青 ============ */
  [data-theme="frost"] {
    --color-bg:            oklch(97.4% 0.004 240);
    --color-surface:       oklch(99.5% 0.002 240);
    --color-surface-2:     oklch(95.6% 0.005 234);
    --color-fg:            oklch(29% 0.016 262);
    --color-muted:         oklch(50% 0.014 256);
    --color-faint:         oklch(59% 0.012 254);
    --color-border:        oklch(91.6% 0.005 240);
    --color-border-strong: oklch(85.4% 0.009 234);
    --color-orange:        oklch(72% 0.075 230);
    --color-accent:        oklch(52% 0.1 262);
    --color-red:           oklch(54% 0.1 285);
    --color-accent-ink:    oklch(44% 0.09 262);
    --color-success:       oklch(52% 0.07 156);
    --color-success-bg:    oklch(96.8% 0.011 156);
    --color-warn:          oklch(58% 0.07 80);
    --color-warn-bg:       oklch(96.7% 0.011 86);
    --color-danger:        oklch(54% 0.068 32);
    --color-danger-bg:     oklch(96.7% 0.009 33);
    --color-info:          oklch(54% 0.055 240);
    --color-info-bg:       oklch(96.8% 0.008 240);
    --color-on-accent:     #fff;
    --shadow-1: 0 1px 2px rgba(12, 18, 40, 0.05), 0 8px 24px rgba(12, 18, 40, 0.055);
    --shadow-2: 0 2px 4px rgba(12, 18, 40, 0.06), 0 16px 40px rgba(12, 18, 40, 0.13);
    --shadow-xs: 0 1px 3px rgba(8, 12, 30, 0.09);
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--color-bg); color: var(--color-fg);
    font-family: var(--font-ui); font-size: var(--fs-13); line-height: 1.6;
  }
  svg { flex: none; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 1px; }

  .app { display: flex; flex-direction: column; height: 100%; }

  /* ============ 顶栏（极简） ============ */
  .topbar {
    display: flex; align-items: center; gap: 10px; flex: none;
    padding: 0 14px 0 16px; height: 44px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brandDot {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--grad-accent); background-size: 160% 160%;
  }
  .brandName { font-weight: var(--fw-bold); font-size: var(--fs-13); }
  .schemeTag {
    font-size: var(--fs-11); color: var(--color-faint);
    padding: 2px 9px; border: 1px solid var(--color-border); border-radius: var(--radius-pill);
  }
  .topRight { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .themeDots { display: flex; gap: 5px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-pill); }
  .tdot {
    width: 16px; height: 16px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--color-border-strong);
    transition: transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .tdot:hover { transform: scale(1.12); }
  .tdot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--color-accent-45); }

  /* ============ 主体两栏 ============ */
  .shell { flex: 1; min-height: 0; display: flex; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--color-bg); }

  .chatScroll {
    flex: 1; min-height: 0; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) transparent;
    padding: 18px 24px 8px;
  }
  .chatInner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .runDivider { display: flex; align-items: center; gap: 12px; color: var(--color-faint); font-size: var(--fs-11); letter-spacing: 0.05em; margin: 8px 0 2px; }
  .runDivider::before, .runDivider::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }

  .msgUser {
    align-self: flex-end; max-width: 76%;
    padding: 9px 13px;
    background: var(--color-accent-9);
    border: 1px solid color-mix(in oklab, var(--color-accent) 14%, var(--color-border));
    border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
    font-size: var(--fs-chat);
    animation: msg-enter var(--duration-base) var(--ease-out);
  }
  .msgAssistant { max-width: 94%; animation: msg-enter var(--duration-base) var(--ease-out); }
  .msgHead { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .avatar {
    display: inline-grid; place-items: center; flex: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--color-accent-11); color: var(--color-accent-ink);
    font-size: 11px; font-weight: var(--fw-semibold);
  }
  .msgHead .avatar.assistant { background: var(--grad-accent); color: var(--color-on-accent); }
  .msgHead b { font-size: var(--fs-12-5); font-weight: var(--fw-semibold); }
  .msgHead .mMeta { font-size: var(--fs-11); color: var(--color-faint); font-family: var(--font-mono); }
  .chip {
    display: inline-flex; align-items: center; gap: 3px; flex: none;
    padding: 1px 7px; border-radius: var(--radius-pill);
    font-size: var(--fs-10-5); font-weight: var(--fw-semibold); line-height: 1.6; white-space: nowrap;
  }
  .chip.faint { background: transparent; color: var(--color-faint); border: 1px solid var(--color-border); }

  .toolGroup {
    display: flex; flex-direction: column; gap: 5px;
    margin: 8px 0 10px; padding: 7px 11px;
    border-left: 2px solid color-mix(in oklab, var(--color-accent) 32%, transparent);
    background: color-mix(in oklab, var(--color-fg) 3.5%, transparent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .toolLine { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; font-size: var(--fs-12); line-height: 1.6; }
  .toolDone { color: var(--color-muted); white-space: nowrap; }
  .toolDone svg { color: var(--color-success); margin-right: 3px; vertical-align: -2px; }
  .toolRunning { color: var(--color-fg); font-weight: var(--fw-medium); white-space: nowrap; }
  .spinner {
    display: inline-block; width: 10px; height: 10px;
    border: 1.5px solid currentColor; border-top-color: transparent;
    border-radius: 50%; vertical-align: -1px;
    animation: spinner-rotate 0.8s linear infinite;
  }

  /* ---- 实体标签（点击 → 标签附近浮层预览卡） ---- */
  .entTag {
    display: inline-flex; align-items: center; gap: 3px;
    margin: 0 1px; padding: 0 6px; vertical-align: 1px;
    border: 1px solid color-mix(in oklab, var(--color-accent) 30%, var(--color-border));
    border-radius: var(--radius-sm);
    background: var(--color-accent-8-t); color: var(--color-accent-ink);
    font-family: var(--font-mono); font-size: 0.82em; line-height: 1.7;
    cursor: pointer; white-space: nowrap;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .entTag:hover {
    border-color: var(--color-accent);
    background: var(--color-accent-11);
    box-shadow: 0 0 0 2px var(--color-accent-8-t);
  }
  .entTag svg { opacity: 0.75; }

  /* ---- 实体浮层预览卡 ---- */
  .entPop {
    position: fixed; z-index: 95; width: 302px;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    background: var(--color-surface); box-shadow: var(--shadow-2);
    padding: 12px 14px 13px;
    animation: view-in 0.18s var(--ease-out);
  }
  .entPop .epHead { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; padding-right: 22px; }
  .entPop .epHead .avatar { width: 28px; height: 28px; font-size: 12.5px; }
  .entPop .epHead .convIcon {
    width: 28px; height: 28px; flex: none;
    display: grid; place-items: center;
    border-radius: 50%; background: var(--color-accent-11); color: var(--color-accent-ink);
  }
  .entPop .epHead b { font-size: var(--fs-13); }
  .entPop .epHead small { display: block; font-size: var(--fs-10-5); color: var(--color-faint); }
  .entPop .epClose {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; display: grid; place-items: center;
    border: 0; border-radius: 50%; background: transparent;
    color: var(--color-faint); cursor: pointer;
  }
  .entPop .epClose:hover { background: var(--color-surface-2); color: var(--color-fg); }
  .entPop p { margin: 0 0 9px; font-size: var(--fs-12); line-height: 1.75; color: var(--color-muted); }
  .entPop .epGo {
    display: inline-flex; align-items: center; gap: 4px;
    border: 0; background: none; padding: 0;
    color: var(--color-accent-ink); font-size: var(--fs-12); font-weight: var(--fw-semibold); cursor: pointer;
  }
  .entPop .epGo:hover { text-decoration: underline; }

  /* ---- 决策收口提示 ---- */
  .sysMsg {
    align-self: center;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 14px;
    border: 1px solid color-mix(in oklab, var(--color-success) 32%, transparent);
    border-radius: var(--radius-pill);
    background: var(--color-success-bg); color: var(--color-success);
    font-size: var(--fs-12); font-weight: var(--fw-medium);
    animation: msg-enter var(--duration-base) var(--ease-out);
  }

  /* ============ 流内审批组卡 ============ */
  .apGroupCard {
    border: 1px solid color-mix(in oklab, var(--color-warn) 36%, var(--color-border-strong));
    border-radius: var(--radius-md);
    background: var(--color-surface);
    box-shadow: var(--shadow-1);
    overflow: hidden;
    animation: msg-enter var(--duration-base) var(--ease-out);
  }
  .apGroupCard.done { border-color: var(--color-border-strong); }
  .apGroupHead {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
  }
  .apGroupHead .hIcon { color: var(--color-warn); display: inline-flex; }
  .apGroupCard.done .apGroupHead .hIcon { color: var(--color-success); }
  .apGroupHead b { font-size: var(--fs-13); }
  .apCnt {
    font-family: var(--font-mono); font-size: var(--fs-10-5); font-weight: var(--fw-bold);
    color: var(--color-warn); background: var(--color-warn-bg);
    padding: 1px 8px; border-radius: var(--radius-pill);
  }
  .apCnt.zero { color: var(--color-success); background: var(--color-success-bg); }
  .apGroupHead .hint { font-size: var(--fs-10-5); color: var(--color-faint); }

  .apItem + .apItem { border-top: 1px solid var(--color-border); }
  .apItemBar {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 14px; cursor: pointer;
    transition: background var(--duration-fast) var(--ease-out);
  }
  .apItemBar:hover { background: var(--color-surface-2); }
  .apItem.pending .apItemBar { background: color-mix(in oklab, var(--color-warn) 4%, transparent); }
  .apItemBar .glyph {
    flex: none; width: 17px; text-align: center;
    font-family: var(--font-mono); font-weight: var(--fw-bold); font-size: var(--fs-13);
  }
  .glyph.add { color: var(--color-success); }
  .glyph.edit, .glyph.delete { color: var(--color-danger); }
  .glyph.exit { color: var(--color-accent-ink); }
  .apItemBar .barText { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .apItemBar .barText b { font-size: var(--fs-13); font-weight: var(--fw-semibold); }
  .apItemBar .barText small { font-size: var(--fs-10-5); color: var(--color-faint); font-family: var(--font-mono); }
  .apPill { flex: none; font-size: 10px; font-weight: var(--fw-bold); border-radius: var(--radius-pill); padding: 1px 6px; }
  .apPill.pending { background: var(--color-warn-bg); color: var(--color-warn); }
  .apPill.approved { background: var(--color-success-bg); color: var(--color-success); }
  .apPill.rejected { background: var(--color-danger-bg); color: var(--color-danger); }
  .apPill.edited { background: var(--color-info-bg); color: var(--color-info); }
  .apItemBar .chev { color: var(--color-faint); display: grid; place-items: center; transition: transform .18s var(--ease-out); }
  .apItem.open .apItemBar .chev { transform: rotate(180deg); }
  .apItem.processed { background: color-mix(in oklab, var(--color-surface-2) 42%, var(--color-surface)); }
  .apItem.processed .apItemBar b { color: var(--color-muted); }

  .apItemBody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s var(--ease-out); }
  .apItemBody[data-open="true"] { grid-template-rows: 1fr; }
  .apItemBodyInner { overflow: hidden; }
  .apItemBodyPad { padding: 4px 16px 14px 40px; }
  .apIdentity { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-family: var(--font-mono); font-size: var(--fs-11); color: var(--color-faint); }
  .apSection { margin-top: 10px; }
  .apSectionHead { display: flex; align-items: center; gap: 5px; font-size: var(--fs-10-5); font-weight: var(--fw-bold); color: var(--color-faint); letter-spacing: 0.05em; margin-bottom: 5px; }
  .apSectionHead svg { opacity: 0.7; }
  .apCur {

"use strict";
/* ================= 图标（lucide 风格内联 SVG） ================= */
const P = {

    let cur = "";
    if (g.existing) {
      cur = `<div class="apSection">
        <div class="apSectionHead">${ic("clock", 11)}${curHead}</div>
        <div class="apCur ${g.op}">
          ${g.existing.text ? `<div class="apCurText">${esc(g.existing.text)}</div>` : ""}
          ${g.existing.rows ? `<dl class="apParam">${g.existing.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
        </div>
      </div>`;
    } else {
      cur = `<div class="apSection">
        <div class="apSectionHead">${ic("clock", 11)}当前内容</div>
        <div class="apCur add"><span class="apEmpty">无既有数据 · 此操作为新建</span></div>
      </div>`;
    }
    body = cur + `<div class="apSection">
      <div class="apSectionHead">${ic(g.op === "delete" ? "x" : g.op === "add" ? "plus" : "edit", 11)}${g.op === "delete" ? "删除参数" : g.op === "edit" ? "变更后" : "写入内容"}</div>
      <dl class="apParam">${g.params.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    </div>`;
  }
  const foot = g.status !== "pending"
    ? `<div class="apBanner ${g.status}">已处理 · ${AP_STATUS_LABEL[g.status]}${g._ctextShow ? "（" + esc(g._ctextShow) + "）" : ""}</div>`
    : `<div class="apActions">
        <button class="btn btnPrimary btnSm" data-act="apDecide" data-gid="${g.id}" data-id="approve">${ic("check", 12)}批准</button>
        <button class="btn btnGhostDanger btnSm" data-act="apDecide" data-gid="${g.id}" data-id="reject">${ic("x", 12)}拒绝</button>
        <button class="btn btnGhost btnSm" data-act="apDecide" data-gid="${g.id}" data-id="comment">请求修改</button>
      </div>
      <div class="apCommentWrap" data-open="${!!g._cOpen}" style="margin-top:8px;">
        <div class="apCommentInner">
          <textarea class="apComment" data-gid="${g.id}" rows="2" placeholder="填写修改意见（将随决策回传会话）">${esc(g._ctext || "")}</textarea>
          <div class="apActions">
            <button class="btn btnGhost btnSm" data-act="apDecide" data-gid="${g.id}" data-id="cancel">取消</button>
            <button class="btn btnPrimary btnSm" data-act="apDecide" data-gid="${g.id}" data-id="submit" ${!(g._ctext || "").trim() ? "disabled" : ""}>提交修改意见</button>
          </div>
        </div>
      </div>`;
  return `<div class="apIdentity">${g.op === "exit" ? "退出设计模式 · ExitComposeMode" : esc(g.tool) + " · " + AP_TOOL_CODE[g.op]}</div>
    ${g.stale && g.status === "pending" ? `<div class="apStale">版本已过期：正式稿已被其他修改更新，批准后此操作可能执行失败</div>` : ""}
    ${body}${foot}`;
}

        </div>
      </div>
      <div class="composerHint"><span><b>Enter</b> 发送</span><span><b>Shift+Enter</b> 换行</span><span>Tab 引用 角色 / 大纲 / 正文</span></div>
    </div>
  </div>`;
}
function renderMain() {
  const prev = $("chatScroll");
  const top = prev ? prev.scrollTop : 0;
  $("main").innerHTML = `
    <div class="chatScroll" id="chatScroll"><div class="chatInner">${chatTimelineHTML()}</div></div>
    ${composerHTML()}`;
  const sc = $("chatScroll");
  if (sc) sc.scrollTop = top;
}

/* ================= 渲染 · 右栏挂起清单 ================= */
function renderPanel() {
  const n = pendingN();
  const pend = aps.filter(g => g.status === "pending");
  const done = aps.filter(g => g.status !== "pending");
  $("insBody").innerHTML = `
    <div class="insHead">
      <b>审批队列</b>
      <span class="apCnt${n === 0 ? " zero" : ""}">${n === 0 ? "全部处理完" : n}</span>
      <span class="kicker">点击条目 → 滚动定位到对话流中的卡片</span>
    </div>
    <div class="qList">
      <div class="qGroupLbl">待决 ${n}</div>
      ${pend.map(g => qRowHTML(g)).join("") || `<div style="padding:2px 8px;color:var(--color-faint);font-size:var(--fs-11);">（无待决项）</div>`}
      ${done.length ? `<div class="qGroupLbl">已处理 ${done.length} · 已留痕</div>` + done.map(g => qRowHTML(g)).join("") : ""}
    </div>
    <div class="insFoot">
      <button class="btn btnSecondary btnSm" data-act="apAll" ${n === 0 ? "disabled" : ""}>${ic("check", 12)}全部批准（${n}）</button>
    </div>
    <div class="insNote">方案 B 对照：审批原文与操作都在左侧对话流内联（760px 宽度阅读）；本栏只是挂起清单与定位器。面板左缘可拖拽调宽（双击复位）。</div>`;
}
function qRowHTML(g) {
  return `<button class="qRow${g.status === "pending" ? "" : " processed"}" data-act="qLocate" data-id="${g.id}" title="定位到对话流中的审批卡">
    <span class="glyph ${g.op === "exit" ? "exit" : g.op}">${AP_GLYPH[g.op]}</span>
    <span class="qText"><b>${esc(g.tool)} · ${esc(g.title)}</b><small>${AP_TOOL_CODE[g.op]}</small></span>
    <span class="apPill ${g.status}">${AP_STATUS_LABEL[g.status]}</span>
  </button>`;
}

/* ================= 决策流 ================= */
function decide(g, kind, note) {
  if (g.status !== "pending") return;
  g.status = kind;
  g._cOpen = false;
  if (note) g._ctextShow = note;
  if (pendingN() === 0) {
    state.done = true;
    state.open = -1;
    renderMain(); renderPanel();
    toast("本轮审批已全部处理，会话继续");
    scrollChatBottom();
  } else {
    const next = aps.findIndex(x => x.status === "pending");
    state.open = next;
    renderMain(); renderPanel();
    keepViewOnCard();
    toast(`还剩 ${pendingN()} 项待决，已展开下一项`);
  }
}
function keepViewOnCard() {
  const card = $("apGroupCard");
  if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function scrollChatBottom() {
  const sc = $("chatScroll");
  if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
}
function resetApproval() {
  aps = AP_TEMPLATES.map((t, i) => ({ id: i, ...structuredClone(t), status: "pending" }));
  state.open = 0; state.done = false; pendSec = 0;
  renderMain(); renderPanel();
  scrollChatBottom();
}

/* ================= 右栏拖拽调宽 ================= */
const INSP_MIN = 320, INSP_MAX = 640, INSP_DEFAULT = 340;
const grip = $("insGrip"), gripTip = $("gripTip");
function applyW(w) {
  state.insW = w;
  document.querySelector(".app").style.setProperty("--insp-w", w + "px");
  gripTip.textContent = w + "px";
}
grip.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  grip.classList.add("dragging");
  document.body.classList.add("resizing");
  gripTip.classList.add("show");
  const startX = e.clientX, startW = state.insW || INSP_DEFAULT;
  applyW(startW);
  const move = (ev) => applyW(Math.max(INSP_MIN, Math.min(INSP_MAX, Math.round(startW - (ev.clientX - startX)))));
  const up = () => {
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", up);
    grip.classList.remove("dragging");
    document.body.classList.remove("resizing");
    setTimeout(() => gripTip.classList.remove("show"), 500);
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
});
grip.addEventListener("dblclick", () => {
  state.insW = null;
  document.querySelector(".app").style.removeProperty("--insp-w");
  gripTip.textContent = INSP_DEFAULT + "px";
  gripTip.classList.add("show");
  setTimeout(() => gripTip.classList.remove("show"), 600);
  toast("已复位右栏宽度 " + INSP_DEFAULT + "px");
});

/* ================= 实体标签浮层预览 ================= */
let entPop = null;
function closeEntPop() {
  if (entPop) { entPop.remove(); entPop = null; }
}
function openEntPop(anchor, type, id) {
  closeEntPop();
  const meta = ENT[type];
  const e = meta.list.find(x => x.id === id);
  if (!e) return;
  const pop = document.createElement("div");
  pop.className = "entPop";
  pop.innerHTML = `
    <button class="epClose" data-act="entClose" title="关闭">${ic("x", 11, 2.2)}</button>
    <div class="epHead">
      ${type === "char" ? `<span class="avatar">${esc(e.name[0])}</span>` : `<span class="convIcon">${ic("mapPin", 14)}</span>`}
      <div><b>${esc(e.name)}</b><small>${meta.label} · ${esc(e.role || e.locState || "")}</small></div>
    </div>
    <p>${esc(e.summary)}</p>
    <button class="epGo" data-act="entGo" data-type="${type}" data-id="${id}">跳转到完整档案 ${ic("arrowRight", 11)}</button>`;
  document.body.appendChild(pop);
  entPop = pop;
  const r = anchor.getBoundingClientRect();
  const pw = 302, ph = pop.offsetHeight;
  let left = Math.max(8, Math.min(r.left - 20, window.innerWidth - pw - 8));
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

/* ================= 事件委托 ================= */
document.addEventListener("click", (e) => {
  if (entPop && !e.target.closest(".entPop") && !e.target.closest(".entTag")) closeEntPop();
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "theme":
      document.documentElement.dataset.theme = id;
      state.theme = id; renderThemeDots();
      break;
    case "ent":
      openEntPop(el, el.dataset.type, el.dataset.id);
      break;
    case "entClose":
      closeEntPop();
      break;
    case "entGo": {
      const meta = ENT[el.dataset.type];
      const e2 = meta.list.find(x => x.id === el.dataset.id);
      toast(`跳转到完整档案：${meta.label} › ${e2.name}（完整跳转见 app-redesign-demo）`);
      closeEntPop();
      break;
    }
    case "mdLink":
      toast("演示链接：真实实现打开目标地址");
      break;
    case "fnGo":
      document.querySelector(".mdFootnotes")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      toast("脚注：正文上标 → 页末注释区");
      break;
    case "itemToggle": {
      const i = Number(id);
      state.open = state.open === i ? -1 : i;
      renderMain();
      break;
    }
    case "apDecide": {
      const g = aps.find(x => x.id === Number(el.dataset.gid));
      if (!g) break;
      if (id === "approve") decide(g, "approved");
      else if (id === "reject") decide(g, "rejected");
      else if (id === "comment") { g._cOpen = !g._cOpen; renderMain(); }
      else if (id === "cancel") { g._cOpen = false; renderMain(); }
      else if (id === "submit") decide(g, "edited", (g._ctext || "").trim());
      break;
    }
    case "apAll":
      aps.filter(g => g.status === "pending").forEach(g => { g.status = "approved"; g._cOpen = false; });
      state.done = true; state.open = -1;
      renderMain(); renderPanel();
      toast("已全部批准，本轮审批处理完毕");
      scrollChatBottom();
      break;
    case "qLocate": {
      const g = aps.find(x => x.id === Number(id));
      if (!g) break;
      const idx = aps.indexOf(g);
      state.open = idx;
      renderMain();
      const item = $("apItem-" + idx);
      if (item) {
        item.scrollIntoView({ block: "center", behavior: "smooth" });
        item.classList.remove("flash"); void item.offsetWidth; item.classList.add("flash");
      }
      const qr = el;
      qr.classList.remove("flash"); void qr.offsetWidth; qr.classList.add("flash");
      break;
    }
    case "scrollToCard": {
      const card = $("apGroupCard");
      if (card) {
        card.scrollIntoView({ block: "center", behavior: "smooth" });
        card.classList.remove("flash"); void card.offsetWidth;
      }
      break;
    }
    case "replay":
      resetApproval();
      toast("已重放：审批卡到达对话流末尾");
      break;
  }
});
/* 意见输入（启用提交按钮，不整卡重渲染） */
document.addEventListener("input", (e) => {
  const ta = e.target;
  if (ta.classList && ta.classList.contains("apComment")) {
    const g = aps.find(x => x.id === Number(ta.dataset.gid));
    if (!g) return;
    g._ctext = ta.value;
    const submit = ta.closest(".apCommentInner").querySelector('[data-id="submit"]');
    if (submit) submit.disabled = g._ctext.trim() === "";
  }
  if (ta.id === "chatInput") {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
  }
});
/* 滚动任意区域时收起实体浮层（避免错位） */
document.addEventListener("scroll", () => closeEntPop(), true);

/* ================= Toast / 主题 / 计时 ================= */
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}
const THEMES = [
  { id: "paper", c: "#a0522d" }, { id: "ink", c: "#2b2723" },
  { id: "celadon", c: "#24303a" }, { id: "frost", c: "#d9e2f2" },
];
function renderThemeDots() {
  $("themeDots").innerHTML = THEMES.map(t =>
    `<button class="tdot" data-act="theme" data-id="${t.id}" aria-pressed="${state.theme === t.id}" title="${t.id}" style="background:${t.c}"></button>`).join("");
}
setInterval(() => {
  if (state.done || pendingN() === 0) pendSec = 0;
  else pendSec += 1;
  const el = $("pendSec");
  if (el) el.textContent = pendSec + "s";
}, 1000);

/* ================= 启动 ================= */
renderThemeDots();
resetApproval();
</script>
</body>
</html>
