<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>布局重设计 demo · Novel 创作台</title>
<style>
  /* ============================================================
     前端整体布局重设计 demo（单文件，交互式）· v0.8
     基于 theme-candidates-demo-2.html 的四主题 token 体系 + 现有功能结构：
       · 顶栏：侧栏开关 / 品牌 / 工作区 / 中央三视图 tab / 工作区·设置 / 窗口控制（Win·Mac）
       · 对话视图：左侧会话目录 · 中部对话流（正文/草稿/工具行/输入区/模式/发送·暂停
         + markdown 全格式样例轮 + 实体标签定位）· 右侧内容目录（大纲/人物/地点，
         详情卡 + 跳完整档案 + 拖拽调宽）
       · 审批：整体弹窗（左清单 + 右详情 + 全部批准；稍后处理 → 顶部提示条常驻唤回，
         处理完不留过往记录）
       · 内容视图：左侧资料位（大纲树 / 正文卷章 / 人物 / 地点）· 右侧具体内容
       · 计划视图：左侧「安排」目录 · 右侧总览（统计/双状态轴/大纲进度）或待办详情
     窗口尺寸：容器查询断点 1280 / 1080；最小窗口 1080（对齐 tokens.css 约定）。
     ============================================================ */
  :root {
    /* --- L2 设计语言（全部主题不变，对齐 tokens.css） --- */
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "HarmonyOS Sans SC", "MiSans",
      "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei UI", "Microsoft YaHei",
      system-ui, sans-serif;
    --font-body: "Iowan Old Style", "Palatino Linotype",
      "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong",
      "SimSun", Georgia, serif;
    --font-kai: "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

    --fs-chat: 15.5px;
    --fs-12: 12px; --fs-13: 13px; --fs-12-5: 12.5px; --fs-11: 11px; --fs-11-5: 11.5px;
    --fs-10-5: 10.5px; --fs-16-5: 16.5px;
    --fw-regular: 400; --fw-medium: 550; --fw-semibold: 650; --fw-bold: 700;

    --radius-sm: 6px; --radius-md: 9px; --radius-lg: 14px; --radius-pill: 999px;
    --duration-fast: 0.15s; --duration-base: 0.22s;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

    /* --- L3 语义色 = 宣纸白（默认） --- */
    --color-bg:            oklch(97.9% 0.003 85);
    --color-surface:       oklch(99.8% 0.0015 85);
    --color-surface-2:     oklch(96.2% 0.004 82);
    --color-fg:            oklch(30% 0.009 46);
    --color-muted:         oklch(52% 0.009 54);
    --color-faint:         oklch(60% 0.009 58);
    --color-border:        oklch(92.4% 0.003 82);
    --color-border-strong: oklch(86.4% 0.006 72);
    --color-orange:        oklch(73% 0.068 60);
    --color-accent:        oklch(55% 0.072 42);
    --color-red:           oklch(58% 0.075 32);
    --color-accent-ink:    oklch(47% 0.062 41);
    --color-success:       oklch(52% 0.07 156);
    --color-success-bg:    oklch(97.2% 0.011 156);
    --color-warn:          oklch(59% 0.07 80);
    --color-warn-bg:       oklch(97.1% 0.011 86);
    --color-danger:        oklch(54% 0.068 32);
    --color-danger-bg:     oklch(97.1% 0.009 33);
    --color-info:          oklch(54% 0.05 235);
    --color-info-bg:       oklch(97.2% 0.007 236);
    --color-on-accent:     #fff;

    --color-accent-9:   color-mix(in oklab, var(--color-accent) 9%, var(--color-surface));
    --color-accent-8-t: color-mix(in oklab, var(--color-accent) 8%, transparent);
    --color-accent-11:  color-mix(in oklab, var(--color-accent) 11%, var(--color-surface));
    --color-accent-45:  color-mix(in oklab, var(--color-accent) 45%, transparent);
    --color-danger-12:  color-mix(in oklab, var(--color-danger) 12%, var(--color-surface));
    --color-danger-32:  color-mix(in oklab, var(--color-danger) 32%, transparent);
    --color-chrome-bg:  color-mix(in oklab, var(--color-surface) 82%, transparent);
    --color-focus-ring: color-mix(in oklab, var(--color-accent) 42%, transparent);
    --color-selection:  color-mix(in oklab, var(--color-accent) 16%, transparent);
    --color-scrollbar-thumb: color-mix(in oklab, var(--color-fg) 15%, transparent);

    --grad-accent: linear-gradient(105deg,
      var(--color-orange) 0%, var(--color-accent) 48%, var(--color-red) 100%);
    --grad-warn-text: linear-gradient(105deg,
      oklch(82% 0.055 85), oklch(59% 0.07 80) 55%, oklch(68% 0.07 75));
    --color-warn-40:     color-mix(in oklab, var(--color-warn) 40%, transparent);
    --color-danger-12-t: color-mix(in oklab, var(--color-danger) 12%, transparent);

    --shadow-1: 0 1px 2px rgba(40, 22, 10, 0.04), 0 8px 24px rgba(40, 22, 10, 0.045);
    --shadow-2: 0 2px 4px rgba(40, 22, 10, 0.05), 0 16px 40px rgba(40, 22, 10, 0.11);
    --shadow-xs: 0 1px 3px rgba(20, 12, 6, 0.08);

    /* --- 布局尺寸（本 demo 新增） --- */
    --titlebar-h: 46px;
    --sidebar-w: 272px;
    --insp-w: 376px;
  }

  /* ============ 墨夜 ============ */
  [data-theme="ink"] {
    --color-bg:            oklch(21% 0.005 80);
    --color-surface:       oklch(25.5% 0.006 80);
    --color-surface-2:     oklch(28.5% 0.007 78);
    --color-fg:            oklch(89% 0.006 85);
    --color-muted:         oklch(70% 0.008 80);
    --color-faint:         oklch(59% 0.007 80);
    --color-border:        oklch(31% 0.007 80);
    --color-border-strong: oklch(40% 0.01 78);
    --color-orange:        oklch(77% 0.095 62);
    --color-accent:        oklch(68% 0.115 42);
    --color-red:           oklch(66% 0.115 30);
    --color-accent-ink:    oklch(78% 0.09 45);
    --color-success:       oklch(72% 0.095 156);
    --color-success-bg:    oklch(29% 0.032 156);
    --color-warn:          oklch(75% 0.1 80);
    --color-warn-bg:       oklch(29% 0.034 85);
    --color-danger:        oklch(67% 0.1 32);
    --color-danger-bg:     oklch(28% 0.03 33);
    --color-info:          oklch(70% 0.075 235);
    --color-info-bg:       oklch(28% 0.024 236);
    --color-on-accent:     oklch(24% 0.03 42);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.32), 0 16px 40px rgba(0, 0, 0, 0.48);
    --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.35);
  }
  /* ============ 黛青 ============ */
  [data-theme="celadon"] {
    --color-bg:            oklch(20% 0.013 235);
    --color-surface:       oklch(24% 0.015 235);
    --color-surface-2:     oklch(27% 0.017 232);
    --color-fg:            oklch(89% 0.009 225);
    --color-muted:         oklch(69% 0.013 230);
    --color-faint:         oklch(58% 0.012 230);
    --color-border:        oklch(30% 0.015 235);
    --color-border-strong: oklch(38% 0.019 232);
    --color-orange:        oklch(78% 0.07 190);
    --color-accent:        oklch(75% 0.1 195);
    --color-red:           oklch(68% 0.11 265);
    --color-accent-ink:    oklch(84% 0.075 205);
    --color-success:       oklch(72% 0.095 158);
    --color-success-bg:    oklch(28% 0.032 158);
    --color-warn:          oklch(76% 0.1 90);
    --color-warn-bg:       oklch(28% 0.032 88);
    --color-danger:        oklch(68% 0.11 25);
    --color-danger-bg:     oklch(28% 0.03 25);
    --color-info:          oklch(72% 0.08 240);
    --color-info-bg:       oklch(28% 0.028 240);
    --color-on-accent:     oklch(20% 0.04 230);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.32);
    --shadow-2: 0 2px 4px rgba(0, 0, 0, 0.32), 0 16px 40px rgba(0, 0, 0, 0.5);
    --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.36);
  }
  /* ============ 雪青 ============ */
  [data-theme="frost"] {
    --color-bg:            oklch(97.4% 0.004 240);
    --color-surface:       oklch(99.5% 0.002 240);
    --color-surface-2:     oklch(95.6% 0.005 234);
    --color-fg:            oklch(29% 0.016 262);
    --color-muted:         oklch(50% 0.014 256);
    --color-faint:         oklch(59% 0.012 254);
    --color-border:        oklch(91.6% 0.005 240);
    --color-border-strong: oklch(85.4% 0.009 240);
    --color-orange:        oklch(72% 0.075 230);
    --color-accent:        oklch(52% 0.1 262);
    --color-red:           oklch(54% 0.1 285);
    --color-accent-ink:    oklch(44% 0.09 262);
    --color-success:       oklch(52% 0.07 156);
    --color-success-bg:    oklch(96.8% 0.011 156);
    --color-warn:          oklch(58% 0.07 80);
    --color-warn-bg:       oklch(96.7% 0.011 86);
    --color-danger:        oklch(54% 0.068 32);
    --color-danger-bg:     oklch(96.7% 0.009 33);
    --color-info:          oklch(54% 0.055 240);
    --color-info-bg:       oklch(96.8% 0.008 240);
    --color-on-accent:     #fff;
    --shadow-1: 0 1px 2px rgba(12, 18, 40, 0.05), 0 8px 24px rgba(12, 18, 40, 0.055);
    --shadow-2: 0 2px 4px rgba(12, 18, 40, 0.06), 0 16px 40px rgba(12, 18, 40, 0.13);
    --shadow-xs: 0 1px 3px rgba(8, 12, 30, 0.09);
  }

  /* 主题切换全局过渡 */
  html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color 0.35s var(--ease-out), border-color 0.35s var(--ease-out),
      color 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out),
      fill 0.35s var(--ease-out), stroke 0.35s var(--ease-out) !important;
  }

  /* ============ 基础 ============ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--color-bg); color: var(--color-fg);
    font-family: var(--font-ui); font-size: var(--fs-13); line-height: 1.6;
  }
  ::selection { background: var(--color-selection); }
  svg { flex: none; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 1px; }

  .stage { position: fixed; inset: 0; display: grid; place-items: stretch; }
  .stage.sim { place-items: center; padding: 26px; background: color-mix(in oklab, var(--color-bg) 72%, var(--color-fg) 6%); }

  /* ============ 应用窗口框 ============ */
  .appFrame {
    container-type: inline-size;
    position: relative;
    display: grid;
    grid-template-rows: var(--titlebar-h) 1fr;
    width: 100%; height: 100%;
    background: var(--color-bg);
    overflow: hidden;
  }
  .stage.sim .appFrame {
    width: var(--sim-w); height: 100%; max-height: 940px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-2);
  }

  /* ============ 顶栏（标题栏 + tab） ============ */
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 0 0 10px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
    backdrop-filter: blur(12px);
    -webkit-app-region: drag; /* 真实实现：整栏可拖拽窗口 */
    z-index: 5;
  }
  .titlebar button, .titlebar .tabs { -webkit-app-region: no-drag; }

  /* Mac 红绿灯 */
  .traffic { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 12px; align-self: stretch; }
  .tl {
    width: 12px; height: 12px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer; position: relative;
    display: grid; place-items: center; color: rgba(0,0,0,0.55);
  }
  .tl svg { opacity: 0; transition: opacity var(--duration-fast); }
  .traffic:hover .tl svg { opacity: 1; }
  .tl.close { background: #ff5f57; } .tl.min { background: #febc2e; } .tl.max { background: #28c840; }

  .iconBtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex: none;
    border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--color-muted); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .iconBtn:hover { background: var(--color-accent-9); color: var(--color-accent-ink); }
  .iconBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* 激活态（如对话顶条的内容目录开关：目录展开时点亮） */
  .iconBtn.on { background: var(--color-accent-9); color: var(--color-accent-ink); box-shadow: 0 0 0 2px var(--color-accent-8-t); }

  .brand { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .brandDot {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--grad-accent); background-size: 160% 160%;
    animation: grad-flow 6s var(--ease-in-out) infinite;
  }
  .brandName { font-weight: var(--fw-bold); font-size: var(--fs-13); letter-spacing: 0.02em; }

  .wsChip {
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 220px;
    padding: 4px 9px;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    background: transparent; color: var(--color-muted);
    font-size: var(--fs-12-5); font-weight: var(--fw-medium); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .wsChip:hover { background: var(--color-accent-9); color: var(--color-accent-ink); }
  .wsChip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 中央三视图切换器 */
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); position: relative;
    margin: 0 auto; padding: 2px; gap: 2px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface-2);
    box-shadow: var(--shadow-xs);
  }
  .tabs .thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px;
    width: calc((100% - 8px) / 3);
    border-radius: 4px; background: var(--color-surface);
    box-shadow: var(--shadow-xs);
    transition: transform var(--duration-base) var(--ease-out);
  }
  .tabs button {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 4px 14px; border: 0; background: transparent;
    font-size: var(--fs-12); font-weight: var(--fw-medium);
    color: var(--color-muted); cursor: pointer;
    transition: color var(--duration-base) var(--ease-out);
    white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--color-accent-ink); }

  .tbRight { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-left: auto; }
  .appFrame[data-platform="win"] .tbRight { padding-right: 0; }

  /* Windows 窗口控制 */
  .winCtl { display: flex; align-self: stretch; margin-left: 4px; }
  .winCtl button {
    width: 44px; display: grid; place-items: center;
    border: 0; background: transparent; color: var(--color-muted); cursor: pointer;
    transition: background var(--duration-fast), color var(--duration-fast);
  }
  .winCtl button:hover { background: color-mix(in oklab, var(--color-fg) 8%, transparent); color: var(--color-fg); }
  .winCtl button.close:hover { background: #e81123; color: #fff; }

  /* ============ 主体三栏 ============ */
  .shellBody { display: flex; min-height: 0; position: relative; }

  /* --- 侧栏（随视图切换内容） --- */
  .sidebar {
    display: flex; flex-direction: column; gap: 8px;
    width: var(--sidebar-w); flex: none;
    padding: 10px 10px 8px;
    border-right: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
    backdrop-filter: blur(12px);
    overflow: hidden;
    transition: margin-left 0.24s var(--ease-out), transform 0.24s var(--ease-out);
  }
  .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }

  .sideScroll {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) transparent;
    display: flex; flex-direction: column; gap: 2px;
    padding-bottom: 8px;
  }

  .newConvBtn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px; flex: none;
    border: 0; border-radius: var(--radius-md);
    background: var(--grad-accent);
    color: var(--color-on-accent);
    font-size: var(--fs-12-5); font-weight: var(--fw-semibold); cursor: pointer;
    box-shadow: 0 2px 8px var(--color-accent-45);
    transition: transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .newConvBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--color-accent-45); }

  .searchBox {
    display: flex; align-items: center; gap: 7px; flex: none;
    padding: 5px 9px;
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-faint);
    font-size: var(--fs-12);
  }

  .dirGroup { font-size: var(--fs-11); color: var(--color-faint); font-weight: var(--fw-semibold); padding: 8px 8px 3px; letter-spacing: 0.03em; }

  /* 会话行 */
  .convItem {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px;
    border: 1px solid transparent; border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .convItem:hover { background: var(--color-accent-8-t); }
  .convItem.active {
    background: var(--color-accent-9);
    border-color: color-mix(in oklab, var(--color-accent) 18%, var(--color-border-strong));
  }
  .convIcon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; flex: none;
    border-radius: var(--radius-sm);
    background: var(--color-accent-8-t); color: var(--color-accent-ink);
  }
  .convText { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .convTitle { font-weight: var(--fw-medium); font-size: var(--fs-12-5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .convTitle .pinMini { color: var(--color-faint); }
  .convMeta { font-size: var(--fs-11); color: var(--color-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statusDot { width: 6px; height: 6px; flex: none; border-radius: 50%; }

  /* 内容视图资料位（四段 tab） */
  .segTabs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; flex: none;
    padding: 3px;
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface-2); box-shadow: var(--shadow-xs);
  }
  .segTabs button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 0 6px;
    border: 0; border-radius: var(--radius-sm); background: transparent;
    color: var(--color-muted); font-size: var(--fs-11); font-weight: var(--fw-medium);
    cursor: pointer; transition: all var(--duration-fast) var(--ease-out);
  }
  .segTabs button:hover { color: var(--color-accent-ink); }
  .segTabs button[aria-selected="true"] {
    background: var(--color-surface); color: var(--color-accent-ink); box-shadow: var(--shadow-xs);
  }
  .segTabs .n {
    font-family: var(--font-mono); font-size: var(--fs-10-5); color: var(--color-faint);
  }

  .dirHead {
    display: flex; align-items: center; gap: 6px; flex: none;
    padding: 2px 4px 0;
    font-size: var(--fs-11); font-weight: var(--fw-semibold); color: var(--color-muted);
    letter-spacing: 0.03em;
  }
  .dirHead .cnt { font-family: var(--font-mono); font-size: var(--fs-10-5); color: var(--color-accent-ink); background: var(--color-accent-11); padding: 0 7px; border-radius: var(--radius-pill); }
  .dirTools { margin-left: auto; display: flex; gap: 2px; }
  .dirTools .iconBtn { width: 22px; height: 22px; border-radius: 5px; }

  /* 通用目录行 */
  .dirRow {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px;
    border: 1px solid transparent; border-radius: 8px;
    cursor: pointer; text-align: left; width: 100%; background: none; color: var(--color-fg);
    transition: background-color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out);
  }
  .dirRow:hover { background: color-mix(in oklab, var(--color-fg) 5%, transparent); }
  .dirRow.active {
    background: var(--color-accent-9);
    border-color: color-mix(in oklab, var(--color-accent) 20%, var(--color-border-strong));
  }
  .dirLabel { flex: 1; min-width: 0; font-size: var(--fs-12-5); font-weight: var(--fw-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dirLabel small { display: block; font-size: var(--fs-11); font-weight: var(--fw-regular); color: var(--color-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dirRow.abandoned .dirLabel { text-decoration: line-through; color: var(--color-faint); }

  /* 大纲树：嵌套层级 + 引导线 */
  .treeRow { padding: 5px 7px; gap: 5px; }
  .treeRow .chev {
    width: 15px; height: 15px; flex: none;
    display: grid; place-items: center; color: var(--color-faint);
    transition: transform 0.18s var(--ease-out);
  }
  .treeRow.open > .chev { transform: rotate(90deg); }
  .treeChildren {
    display: flex; flex-direction: column;
    margin-left: 9px; padding-left: 7px;
    border-left: 1px solid color-mix(in oklab, var(--color-border-strong) 60%, transparent);
  }
  .treeTick { width: 12px; height: 15px; flex: none; position: relative; }
  .treeTick::before {
    content: ""; position: absolute; left: 2px; top: 50%;
    width: 7px; height: 1px;
    background: color-mix(in oklab, var(--color-border-strong) 75%, transparent);
  }
  .treeLabel { flex: 1; min-width: 0; font-size: var(--fs-12-5); font-weight: var(--fw-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .treeRow.parent > .treeLabel { font-weight: var(--fw-semibold); }
  .treeRow.active .treeLabel { color: var(--color-accent-ink); }

  /* 状态 chip */
  .chip {
    display: inline-flex; align-items: center; gap: 3px; flex: none;
    padding: 1px 7px; border-radius: var(--radius-pill);
    font-size: var(--fs-10-5); font-weight: var(--fw-semibold); line-height: 1.6;
    white-space: nowrap;
  }
  .chip.neutral { background: var(--color-surface-2); color: var(--color-muted); }
  .chip.accent  { background: var(--color-accent-11); color: var(--color-accent-ink); }
  .chip.info    { background: var(--color-info-bg); color: var(--color-info); }
  .chip.warn    { background: var(--color-warn-bg); color: var(--color-warn); }
  .chip.success { background: var(--color-success-bg); color: var(--color-success); }
  .chip.danger  { background: var(--color-danger-bg); color: var(--color-danger); }
  .chip.faint   { background: transparent; color: var(--color-faint); border: 1px solid var(--color-border); }

  .treeLegend { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 10px 8px 4px; border-top: 1px dashed var(--color-border); margin-top: 8px; }
  .legendLine { width: 100%; font-size: var(--fs-10-5); color: var(--color-faint); }
  .legendLbl { font-size: 10px; color: var(--color-faint); font-weight: var(--fw-semibold); letter-spacing: 0.06em; align-self: center; }
  /* leaf 计划：事件序列 / 实体变更的小行 */
  .leafSeq { display: flex; flex-direction: column; gap: 3px; }
  .leafSeq span { display: flex; gap: 7px; align-items: baseline; font-size: var(--fs-12); line-height: 1.6; }
  .leafSeq i { font-family: var(--font-mono); font-style: normal; font-size: var(--fs-10-5); color: var(--color-faint); flex: none; }

  .miniBar { width: 42px; height: 4px; flex: none; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; }
  .miniBar i { display: block; height: 100%; border-radius: 2px; background: var(--color-success); }
  .miniNum { font-family: var(--font-mono); font-size: var(--fs-10-5); color: var(--color-faint); flex: none; }

  .avatar {
    display: inline-grid; place-items: center; flex: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--color-accent-11); color: var(--color-accent-ink);
    font-size: var(--fs-12); font-weight: var(--fw-semibold);
  }

  /* 待办行 */
  .todoDot {
    width: 15px; height: 15px; flex: none; border-radius: 50%;
    border: 1.5px solid var(--color-faint); display: grid; place-items: center; color: transparent;
  }
  .todoDot.done { border-color: var(--color-success); background: var(--color-success); color: var(--color-on-accent); }
  .dirRow.done .dirLabel { color: var(--color-faint); }

  /* --- 主区 --- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--color-bg); }

  .subHead {
    position: relative;
    display: flex; align-items: center; gap: 10px; flex: none;
    padding: 9px 16px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
    backdrop-filter: blur(12px);
  }
  .subTitle { display: flex; flex-direction: column; min-width: 0; }
  .subTitle b { font-size: var(--fs-13); font-weight: var(--fw-semibold); }
  .subTitle .kicker { font-size: var(--fs-11); color: var(--color-faint); }
  .subCtx { font-size: var(--fs-12-5); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subActions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    font-size: var(--fs-12-5); font-weight: var(--fw-medium); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .btnPrimary { border: 0; background: var(--grad-accent); color: var(--color-on-accent); box-shadow: 0 2px 8px var(--color-accent-45); }
  .btnPrimary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--color-accent-45); }
  .btnSecondary { border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-fg); }
  .btnSecondary:hover { border-color: var(--color-accent); color: var(--color-accent-ink); }
  .btnGhost { border: 1px solid transparent; background: transparent; color: var(--color-muted); }
  .btnGhost:hover { background: var(--color-accent-8-t); color: var(--color-accent-ink); }
  .btnGhostDanger { border: 1px solid transparent; background: transparent; color: var(--color-danger); }
  .btnGhostDanger:hover { background: var(--color-danger-12); }
  .btnSm { padding: 4px 11px; font-size: var(--fs-12); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

  .paneBody { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) transparent; }
  .paneInner { max-width: 880px; margin: 0 auto; padding: 22px 32px 56px; animation: view-in 0.3s var(--ease-out); }

  /* 卡片 */
  .cardBlock {
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface); padding: 14px 18px 16px; box-shadow: var(--shadow-1);
    margin-bottom: 14px;
  }
  .cardBlock h3 {
    margin: 0 0 8px; font-size: var(--fs-12); font-weight: var(--fw-semibold);
    color: var(--color-muted); letter-spacing: 0.04em;
  }
  .cardP { margin: 0; font-size: var(--fs-13); line-height: 1.85; color: var(--color-fg); }
  .cardP.kai { font-family: var(--font-kai); color: var(--color-muted); }

  .refChips { display: flex; flex-wrap: wrap; gap: 6px; }
  .refChip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: var(--radius-pill);
    border: 1px solid color-mix(in oklab, var(--color-accent) 22%, var(--color-border));
    background: var(--color-accent-8-t); color: var(--color-accent-ink);
    font-size: var(--fs-11-5); font-weight: var(--fw-medium); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .refChip:hover { background: var(--color-accent-11); }

  .banner {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 9px 12px; border-radius: var(--radius-md);
    font-size: var(--fs-12); font-weight: var(--fw-medium); line-height: 1.6;
  }
  .banner.warn { background: var(--color-warn-bg); color: var(--color-warn); }
  .banner.faint { background: var(--color-surface-2); color: var(--color-faint); }

  /* 大纲单元详情 */
  .unitHead { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 4px; }
  .unitHead h2 { margin: 0; font-size: 17px; font-weight: var(--fw-bold); letter-spacing: 0.01em; }
  .unitSub { color: var(--color-faint); font-size: var(--fs-12); margin: 0 0 14px; font-family: var(--font-mono); }
  .statRowChips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .bigBar { height: 6px; border-radius: 3px; background: var(--color-surface-2); overflow: hidden; flex: 1; min-width: 120px; }
  .bigBar i { display: block; height: 100%; background: var(--grad-accent); border-radius: 3px; }

  /* 正文阅读 */
  .chapterTitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
  .chapterTitle h2 { margin: 0; font-size: 18px; font-weight: var(--fw-bold); font-family: var(--font-body); }
  .chapterMeta { font-size: var(--fs-12); color: var(--color-faint); font-family: var(--font-mono); }
  .blocks { margin-top: 16px; }
  .blocks p {
    margin: 0 0 14px; font-family: var(--font-body); font-size: var(--fs-16-5);
    line-height: 1.95; text-indent: 2em; text-align: justify; color: var(--color-fg);
  }
  .draftBlock {
    position: relative; padding: 10px 14px; margin: 4px 0 14px;
    border-left: 3px solid var(--color-warn);
    background: color-mix(in oklab, var(--color-warn) 6%, var(--color-surface));
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
  }
  .draftBlock p { margin: 0; }
  .draftTag {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;
    font-size: var(--fs-10-5); font-weight: var(--fw-semibold); color: var(--color-warn);
    letter-spacing: 0.05em;
  }

  .emptyKai { text-align: center; padding: 34px 10px; font-family: var(--font-kai); color: var(--color-muted); font-size: 15px; line-height: 2; }
  .emptyKai .glyph { font-size: 22px; display: block; margin-bottom: 6px; opacity: 0.55; }

  /* 档案（人物/地点） */
  .profileHead { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .profileHead .avatar { width: 46px; height: 46px; font-size: 19px; }
  .profileHead h2 { margin: 0; font-size: 18px; font-weight: var(--fw-bold); }
  .profileHead .kicker { font-size: var(--fs-12); color: var(--color-muted); margin-top: 2px; }

  /* 计划视图 */
  .statGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .statCard {
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface); padding: 11px 14px; box-shadow: var(--shadow-1);
  }
  .statCard .num { font-family: var(--font-mono); font-size: 21px; font-weight: var(--fw-bold); color: var(--color-accent-ink); line-height: 1.2; }
  .statCard .num small { font-size: var(--fs-11); color: var(--color-faint); font-weight: var(--fw-regular); margin-left: 3px; }
  .statCard .label { font-size: var(--fs-12); font-weight: var(--fw-medium); margin-top: 2px; }
  .statCard .note { font-size: var(--fs-10-5); color: var(--color-faint); }
  .statCard.warn .num { color: var(--color-warn); }

  .axisRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .axisName {
    flex: none; width: 52px; font-size: var(--fs-11); font-weight: var(--fw-semibold);
    color: var(--color-faint); letter-spacing: 0.06em;
  }
  .axisPill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: var(--radius-pill);
    font-size: var(--fs-12-5); font-weight: var(--fw-medium);
    border: 1px solid var(--color-border); background: var(--color-surface);
  }
  .axisPill .n { font-family: var(--font-mono); font-weight: var(--fw-bold); font-size: var(--fs-11); }
  .axisArrow { color: var(--color-faint); }
  .axisPill.warn { border-color: color-mix(in oklab, var(--color-warn) 35%, transparent); color: var(--color-warn); }
  .axisPill.success { border-color: color-mix(in oklab, var(--color-success) 35%, transparent); color: var(--color-success); }
  .axisPill.accent { border-color: color-mix(in oklab, var(--color-accent) 35%, transparent); color: var(--color-accent-ink); }
  .axisPill.info { border-color: color-mix(in oklab, var(--color-info) 35%, transparent); color: var(--color-info); }
  .axisPill.faint { color: var(--color-faint); }

  .progRow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 8px;
  }
  .progRow:hover { background: var(--color-surface-2); }
  .progRow.parent .treeLabel { font-weight: var(--fw-semibold); }
  .progRow.active { background: var(--color-accent-9); }

  /* 待办详情 */
  .todoCard .unitSub { margin-bottom: 12px; }
  .todoDesc { font-size: var(--fs-13); line-height: 1.9; margin: 0 0 16px; }
  .todoAction { display: flex; gap: 8px; }

  /* ============ 对话视图 ============ */
  .chatScroll {
    flex: 1; min-height: 0; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) transparent;
    padding: 18px 24px 8px;
  }
  .chatInner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  /* 视图切回对话：整条时间线作为一个整体淡入。fresh 常驻不摘——摘类会让被抑制
     子元素的 animation 从 none 变回 msg-enter 触发整列二次重播；live 追加的消息
     改用内联 animation（内联优先级高于此抑制规则） */
  .chatInner.fresh { animation: view-in 0.3s var(--ease-out); }
  .chatInner.fresh .msgUser, .chatInner.fresh .msgAssistant, .chatInner.fresh .askGroupCard { animation: none; }

  .runDivider { display: flex; align-items: center; gap: 12px; color: var(--color-faint); font-size: var(--fs-11); letter-spacing: 0.05em; margin: 8px 0 2px; }
  .runDivider::before, .runDivider::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }

  .msgUser {
    align-self: flex-end; max-width: 76%;
    padding: 9px 13px;
    background: var(--color-accent-9);
    border: 1px solid color-mix(in oklab, var(--color-accent) 14%, var(--color-border));
    border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
    font-size: var(--fs-chat);
    animation: msg-enter var(--duration-base) var(--ease-out);
  }
  .msgAssistant { max-width: 94%; animation: msg-enter var(--duration-base) var(--ease-out); }

  /* ============ 排队消息（幽灵项） ============
     生成/审批中发送 → 消息不进正式时间线，以降透明度虚线气泡即时回显在末尾；
     当前 run 收口后原地晋升为正式气泡（位置不动）。 */
  .msgUser.ghost {
    position: relative;
    opacity: 0.62;
    background: color-mix(in oklab, var(--color-surface-2) 70%, var(--color-surface));
    border: 1px dashed color-mix(in oklab, var(--color-accent) 34%, var(--color-border-strong));
    animation: ghost-in var(--duration-base) var(--ease-out);
  }
  .ghostBadge {
    position: absolute; top: -9px; left: 10px;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 8px;
    border-radius: var(--radius-pill);
    background: var(--color-warn-bg); color: var(--color-warn);
    border: 1px solid color-mix(in oklab, var(--color-warn) 26%, transparent);
    font-size: var(--fs-10-5); font-weight: var(--fw-semibold);
    line-height: 1.5;
  }
  .ghostBadge svg { width: 10px; height: 10px; }
  .ghostBadge .qSec { font-family: var(--font-mono); font-weight: var(--fw-regular); opacity: 0.85; }
  .msgUser.promoted { animation: ghost-promote var(--duration-base) var(--ease-out); }
  @keyframes ghost-in {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 0.62; transform: none; }
  }
  @keyframes ghost-promote {
    from { opacity: 0.62; border-style: dashed; }
    to { opacity: 1; border-style: solid; }
  }
  /* 状态行排队后缀（正在生成/正在审批 行内追加） */
  .rsQueued { color: var(--color-warn); font-size: var(--fs-12); font-weight: var(--fw-semibold); }

  .toolLine { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; margin-top: 2px; font-size: var(--fs-12); line-height: 1.6; }
  .toolLine.apToolLink { cursor: pointer; border-radius: 5px; transition: background var(--duration-fast) var(--ease-out); }
  .toolLine.apToolLink:hover { background: var(--color-accent-8-t); }
  .toolDone { color: var(--color-muted); white-space: nowrap; }
  .toolDone svg { color: var(--color-success); margin-right: 3px; vertical-align: -2px; }
  .toolFailed { color: var(--color-danger); white-space: nowrap; }
  .toolFailed svg { margin-right: 3px; vertical-align: -2px; }
  .toolRunning { color: var(--color-fg); font-weight: var(--fw-medium); white-space: nowrap; }
  .toolRunning .spinner { color: var(--color-warn); margin-right: 5px; }
  .toolRunning .toolSec { color: var(--color-warn); }
  .spinner {
    display: inline-block; width: 10px; height: 10px;
    border: 1.5px solid currentColor; border-top-color: transparent;
    border-radius: 50%; vertical-align: -1px;
    animation: spinner-rotate 0.8s linear infinite;
  }
  .toolSec { margin-left: 4px; font-family: var(--font-mono); font-size: var(--fs-11); animation: node-pulse 2.4s ease-in-out infinite; }

  .mdBody { font-family: var(--font-body); font-size: var(--fs-chat); line-height: 1.85; }
  .mdBody p { margin: 0 0 10px; }
  .quoteKai {
    margin: 4px 0 10px; padding: 8px 14px;
    border-left: 2px solid var(--color-accent-45);
    font-family: var(--font-kai); font-size: var(--fs-chat); color: var(--color-muted);
    background: var(--color-accent-8-t);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  /* ---- markdown 全格式排版（.mdBody 扩展；全部走主题 token，四主题自动适配） ---- */
  .mdBody h1, .mdBody h2, .mdBody h3, .mdBody h4, .mdBody h5, .mdBody h6 {
    font-family: var(--font-ui); color: var(--color-fg); font-weight: var(--fw-bold);
    line-height: 1.4; margin: 18px 0 8px;
  }
  .mdBody > :first-child, .mdBody h1:first-child, .mdBody h2:first-child { margin-top: 2px; }
  .mdBody h1 { font-size: 20px; letter-spacing: 0.01em; }
  .mdBody h2 { font-size: 17.5px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border); }
  .mdBody h3 { font-size: 15.5px; }
  .mdBody h4 { font-size: 14px; }
  .mdBody h5 { font-size: 13px; }
  .mdBody h6 { font-size: 12px; color: var(--color-faint); letter-spacing: 0.05em; }
  .mdBody strong, .mdBody b { font-weight: var(--fw-bold); }
  .mdBody em, .mdBody i { font-style: italic; }
  .mdBody del { color: var(--color-faint); text-decoration-color: color-mix(in oklab, var(--color-danger) 55%, transparent); }
  .mdBody code {
    font-family: var(--font-mono); font-size: 0.84em;
    padding: 1px 5px; border-radius: 4px;
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    color: var(--color-accent-ink);
  }
  .mdBody kbd {
    font-family: var(--font-mono); font-size: 0.78em;
    padding: 1px 5px; border-radius: 4px;
    background: var(--color-surface);
    border: 1px solid var(--color-border-strong);
    border-bottom-width: 2px;
    color: var(--color-fg);
  }
  .mdBody a {
    color: var(--color-accent-ink);
    text-decoration: underline dotted color-mix(in oklab, var(--color-accent) 55%, transparent);
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .mdBody a:hover { text-decoration-style: solid; }
  .mdBody ul, .mdBody ol { margin: 2px 0 10px; padding-left: 1.5em; }
  .mdBody li { margin: 2px 0; }
  .mdBody li > ul, .mdBody li > ol { margin: 2px 0 2px; }
  .mdBody ul { list-style: none; }
  .mdBody ul > li { position: relative; }
  .mdBody ul > li::before {
    content: ""; position: absolute; left: -1em; top: 0.72em;
    width: 5px; height: 5px; border-radius: 1.5px;
    background: color-mix(in oklab, var(--color-accent) 55%, transparent);
  }
  .mdBody ul.task { padding-left: 1.35em; }
  .mdBody ul.task > li::before { content: none; }
  .mdBody ul.task > li { display: flex; align-items: baseline; gap: 7px; }
  .mdBody .taskBox {
    flex: none; width: 14px; height: 14px; margin-top: 4px;
    display: inline-grid; place-items: center;
    border: 1.5px solid var(--color-border-strong); border-radius: 4px;
    font-size: 10px; line-height: 1; color: transparent;
  }
  .mdBody .taskBox.done { background: var(--color-success); border-color: var(--color-success); color: var(--color-on-accent); }
  .mdBody blockquote {
    margin: 4px 0 10px; padding: 7px 14px;
    border-left: 2.5px solid var(--color-accent-45);
    background: var(--color-accent-8-t);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--color-muted);
  }
  .mdBody blockquote p { margin: 0 0 6px; }
  .mdBody blockquote p:last-child { margin-bottom: 0; }
  .mdBody blockquote blockquote {
    background: color-mix(in oklab, var(--color-surface) 55%, transparent);
    border-left-color: var(--color-border-strong);
    font-size: 0.94em;
  }
  .mdBody .codeBlock {
    margin: 6px 0 12px;
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-surface-2); overflow: hidden;
  }
  .mdBody .codeHead {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-faint); font-family: var(--font-mono); font-size: var(--fs-10-5);
    letter-spacing: 0.04em;
  }
  .mdBody .codeHead .dotC { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-45); }
  .mdBody pre {
    margin: 0; padding: 10px 12px;
    overflow-x: auto;
    font-family: var(--font-mono); font-size: var(--fs-12); line-height: 1.75;
    color: var(--color-fg);
  }
  .mdBody pre .cmt { color: var(--color-faint); }
  .mdBody pre .key { color: var(--color-accent-ink); }
  .mdBody pre .str { color: var(--color-success); }
  .mdBody table {
    margin: 6px 0 12px; border-collapse: collapse; width: 100%;
    font-family: var(--font-ui); font-size: var(--fs-12-5);
  }
  .mdBody th, .mdBody td { border: 1px solid var(--color-border); padding: 5px 11px; text-align: left; line-height: 1.6; }
  .mdBody th { background: var(--color-surface-2); font-weight: var(--fw-semibold); white-space: nowrap; }
  .mdBody tbody tr:nth-child(even) { background: color-mix(in oklab, var(--color-surface-2) 45%, transparent); }
  .mdBody hr { border: 0; border-top: 1px solid var(--color-border-strong); margin: 16px 0 14px; }
  .mdBody sup.fnRef { font-size: 0.72em; }
  .mdBody sup.fnRef a { margin: 0 1px; text-decoration: none; padding: 0 3px; }
  .mdBody .mdFootnotes {
    margin-top: 12px; padding-top: 8px;
    border-top: 1px dashed var(--color-border-strong);
    font-size: var(--fs-12); color: var(--color-faint); line-height: 1.8;
  }
  .mdBody .mdFootnotes .fnSym { font-family: var(--font-mono); color: var(--color-accent-ink); margin-right: 5px; }
  .mdBody figure { margin: 6px 0 12px; }
  .mdBody .mdImgPh {
    display: grid; place-items: center;
    height: 118px;
    border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md);
    background:
      linear-gradient(120deg,
        color-mix(in oklab, var(--color-accent) 7%, transparent),
        color-mix(in oklab, var(--color-orange) 9%, transparent) 55%,
        color-mix(in oklab, var(--color-red) 6%, transparent)),
      var(--color-surface);
    color: var(--color-muted); font-family: var(--font-kai); font-size: var(--fs-13);
  }
  .mdBody figcaption { text-align: center; font-size: var(--fs-11); color: var(--color-faint); margin-top: 5px; }

  /* ---- 实体标签（对话流内 <character_沈砚> 等；点击 → 右栏目录定位 + 展开详情） ---- */
  .entTag {
    display: inline-flex; align-items: center; gap: 3px;
    margin: 0 1px; padding: 0 6px; vertical-align: 1px;
    border: 1px solid color-mix(in oklab, var(--color-accent) 30%, var(--color-border));
    border-radius: var(--radius-sm);
    background: var(--color-accent-8-t); color: var(--color-accent-ink);
    font-family: var(--font-mono); font-size: 0.82em; line-height: 1.7;
    cursor: pointer; white-space: nowrap;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .entTag:hover {
    border-color: var(--color-accent);
    background: var(--color-accent-11);
    box-shadow: 0 0 0 2px var(--color-accent-8-t);
  }
  .entTag svg { opacity: 0.75; }

  .draftPanel {
    margin: 6px 0 10px;
    border: 1px solid color-mix(in oklab, var(--color-accent) 18%, var(--color-border-strong));
    border-radius: var(--radius-md);
    background:
      linear-gradient(var(--color-surface), var(--color-surface)) padding-box,
      linear-gradient(120deg,
        color-mix(in oklab, var(--color-orange) 45%, transparent),
        color-mix(in oklab, var(--color-accent) 35%, transparent),
        color-mix(in oklab, var(--color-red) 40%, transparent)) border-box;
    padding: 12px 16px 14px;
  }
  .draftKicker {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--fs-11); font-weight: var(--fw-semibold); letter-spacing: 0.08em;
    background: var(--grad-accent); background-size: 160% 160%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: grad-flow 6s var(--ease-in-out) infinite;
    margin-bottom: 7px;
  }
  .draftBody { font-family: var(--font-body); font-size: var(--fs-chat); line-height: 1.95; }
  .cursor {
    display: inline-block; vertical-align: -2px;
    width: 2px; height: 1em; margin-left: 2px;
    background: var(--color-accent);
    animation: draft-cursor 1.1s steps(2) infinite;
  }

  .sysMsg {
    align-self: center;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 14px;
    border: 1px solid color-mix(in oklab, var(--color-warn) 32%, transparent);
    border-radius: var(--radius-pill);
    background: var(--color-warn-bg); color: var(--color-warn);
    font-size: var(--fs-12); font-weight: var(--fw-medium); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .sysMsg:hover { box-shadow: 0 0 0 3px var(--color-warn-40); }
  /* 挂起提示条（审批稍后处理后常驻主区顶部，点击唤回弹窗） */
  .apAlertBar {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    width: calc(100% - 48px); max-width: 760px;
    margin: 10px auto 0;
    padding: 8px 9px 8px 15px;
    border: 1px solid color-mix(in oklab, var(--color-warn) 42%, transparent);
    border-radius: var(--radius-pill);
    background: var(--color-warn-bg); color: var(--color-warn);
    font-size: var(--fs-12-5);
    cursor: pointer;
    animation: msg-enter var(--duration-base) var(--ease-out), alert-glow 2.4s var(--ease-in-out) infinite;
    transition: box-shadow var(--duration-fast) var(--ease-out);
  }
  .apAlertBar:hover { box-shadow: 0 0 0 4px var(--color-warn-40); }
  .apAlertBar b { font-weight: var(--fw-bold); }
  .apAlertBar > svg { flex: none; animation: status-sway 2.8s ease-in-out infinite; }
  .apAlertBar .alertBtn {
    margin-left: auto; flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 13px;
    border-radius: var(--radius-pill);
    background: var(--color-warn); color: var(--color-surface);
    font-size: var(--fs-12); font-weight: var(--fw-semibold);
  }
  /* 消失退场（updateAlertBar 隐藏分支先播再 display:none） */
  .apAlertBar.leaving { animation: alert-out 0.25s ease-in forwards; }
  @keyframes alert-glow {
    0%, 100% { box-shadow: 0 0 0 0 var(--color-warn-40); }
    55% { box-shadow: 0 0 0 5px transparent; }
  }
  @keyframes alert-out { to { opacity: 0; transform: translateY(-6px); } }

  /* 助理消息头：头像 + 名称 + 时间 + 模式 chip（正文与工具行分层更明确） */
  .msgHead { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .msgHead .avatar { width: 24px; height: 24px; font-size: 11px; }
  .msgHead .avatar.assistant { background: var(--grad-accent); color: var(--color-on-accent); }
  .msgHead b { font-size: var(--fs-12-5); font-weight: var(--fw-semibold); }
  .msgHead .mMeta { font-size: var(--fs-11); color: var(--color-faint); font-family: var(--font-mono); }
  /* 工具调用带：一轮里夹在正文中间的调用行分组（含失败 / 运行中） */
  .toolGroup {
    display: flex; flex-direction: column; gap: 5px;
    margin: 8px 0 10px; padding: 7px 11px;
    border-left: 2px solid color-mix(in oklab, var(--color-accent) 32%, transparent);
    background: color-mix(in oklab, var(--color-fg) 3.5%, transparent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .toolGroup .toolLine { margin-top: 0; }

  /* 输入区 */
  .composer {
    flex: none;
    padding: 8px 24px 12px;
    background: linear-gradient(to top, var(--color-bg) 55%, transparent);
  }
  .composerInner { max-width: 760px; margin: 0 auto; }
  .composerBox {
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    box-shadow: var(--shadow-1);
    padding: 8px 10px 8px;
    transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  }
  .composerBox:focus-within { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-8-t), var(--shadow-1); }

  .statusWrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s var(--ease-out); }
  .statusWrap[data-open="true"] { grid-template-rows: 1fr; }
  .statusInner { overflow: hidden; }

  .rsRow {
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 0; min-height: 22px; margin: 0 2px 6px;
    cursor: pointer; border-radius: 6px;
  }
  .rsIcon { position: relative; flex: none; width: 18px; height: 18px; display: grid; place-items: center; }
  .rsIcon svg { width: 15px; height: 15px; }
  .rsRow.generating .rsIcon { color: var(--color-accent-ink); }
  .rsRow.generating .rsIcon svg { animation: status-bob 1.5s ease-in-out infinite; }
  .rsInk {
    position: absolute; right: -4px; top: 4px;
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; animation: status-drop 1.2s ease-in infinite; opacity: 0;
  }
  .rsRow.waiting .rsIcon { color: var(--color-warn); }
  .rsRow.waiting .rsIcon svg { animation: status-sway 2.8s ease-in-out infinite; }
  /* 审批挂起态：状态行升级为可点胶囊（点击唤回审批弹窗） */
  .rsRow.apPending {
    padding: 3px 12px; margin: 0 2px 6px;
    border: 1px solid color-mix(in oklab, var(--color-warn) 38%, transparent);
    border-radius: var(--radius-pill);
    background: var(--color-warn-bg);
  }
  .rsRow.apPending:hover { box-shadow: 0 0 0 3px var(--color-warn-40); }
  .rsLabel {
    font-size: var(--fs-12-5); font-weight: var(--fw-bold); letter-spacing: 0.02em; white-space: nowrap;
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: grad-flow 4.5s ease-in-out infinite; opacity: 0.92;
    border-bottom: 1px solid transparent; padding-bottom: 1px;
  }
  .rsRow.generating .rsLabel { background-image: var(--grad-accent); border-bottom-color: color-mix(in oklab, var(--color-accent) 40%, transparent); }
  .rsRow.waiting .rsLabel { background-image: var(--grad-warn-text); border-bottom-color: var(--color-warn-40); }
  .rsSeconds { font-size: var(--fs-10-5); color: var(--color-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rsRow.failed { color: var(--color-danger); cursor: default; }
  .rsRow.failed .rsIcon svg { animation: failed-shake 0.45s ease-out both; }
  .rsFailedMain { flex: none; color: var(--color-danger); font-size: var(--fs-12-5); font-weight: var(--fw-bold); white-space: nowrap; }
  .rsFailedErr { flex: 1; min-width: 0; color: var(--color-faint); font-size: var(--fs-11); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rsRetry {
    flex: none; width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 50%; display: inline-grid; place-items: center;
    color: var(--color-danger); background: var(--color-danger-12-t); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .rsRetry:hover { color: var(--color-on-accent); background: var(--color-danger); transform: translateY(-1px); }
  .rsRetry svg { width: 11px; height: 11px; }

  /* 执行模式：输入框底栏左侧，点击弹出下拉列表（对齐现网 ComposerModeBar） */
  .modeRow { position: relative; display: flex; align-items: center; gap: 8px; margin: 7px 2px 0; min-height: 24px; }
  .modeRow .sendBtn, .modeRow .pauseBtn { width: 30px; height: 30px; }
  .modeBtn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px;
    border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    background: transparent; color: var(--color-muted);
    font-size: var(--fs-11); font-weight: var(--fw-medium); cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .modeBtn:hover { color: var(--color-accent-ink); border-color: var(--color-accent); }
  .modeBtn[aria-expanded="true"] {
    border-color: color-mix(in oklab, var(--color-accent) 40%, var(--color-border));
    background: var(--color-accent-9); color: var(--color-accent-ink);
  }
  .modeBtn .chev { display: inline-flex; transition: transform 0.18s var(--ease-out); }
  .modeBtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .modeMenu {
    position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 30;
    min-width: 272px; max-width: min(340px, 60vw);
    padding: 5px;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    background: color-mix(in oklab, var(--color-surface) 96%, transparent);
    backdrop-filter: blur(14px); box-shadow: var(--shadow-2);
    animation: view-in 0.18s var(--ease-out);
  }
  .modeItem {
    display: flex; align-items: flex-start; gap: 10px; width: 100%;
    padding: 8px 10px;
    border: 0; border-radius: var(--radius-sm); background: none;
    text-align: left; cursor: pointer; color: var(--color-fg);
    transition: background-color var(--duration-fast) var(--ease-out);
  }
  .modeItem:hover { background: var(--color-accent-8-t); }
  .modeItem[data-cur="1"] { background: var(--color-accent-9); }
  .mi-icon { flex: none; width: 20px; height: 20px; margin-top: 1px; display: grid; place-items: center; color: var(--color-muted); }
  .modeItem[data-cur="1"] .mi-icon { color: var(--color-accent-ink); }
  .mi-text b { display: block; font-size: var(--fs-12-5); font-weight: var(--fw-semibold); }
  .mi-text small { display: block; font-size: var(--fs-11); color: var(--color-faint); line-height: 1.5; margin-top: 1px; }

  .composerRow { display: flex; }
  .composerRow textarea {
    flex: 1; min-height: 36px; max-height: 140px;
    padding: 8px 10px;
    border: 0; background: transparent; resize: none;
    color: var(--color-fg); font-family: inherit; font-size: var(--fs-13); line-height: 1.6;
    outline: none;
  }
  .composerRow textarea::placeholder { color: var(--color-faint); }
  .sendBtn, .pauseBtn {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 34px; height: 34px;
    border: 0; border-radius: var(--radius-md); cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast), background var(--duration-fast);
  }
  .sendBtn { background: var(--grad-accent); color: var(--color-on-accent); box-shadow: 0 2px 8px var(--color-accent-45); }
  .sendBtn:hover { transform: translateY(-1px); }
  .sendBtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  .pauseBtn {
    display: none;
    background: color-mix(in oklab, var(--color-warn) 14%, var(--color-surface));
    color: var(--color-warn);
    border: 1px solid color-mix(in oklab, var(--color-warn) 35%, transparent);
  }
  .pauseBtn:hover { background: var(--color-warn); color: var(--color-on-accent); }
  .composer[data-gen="generating"] .pauseBtn { display: inline-flex; }
  .composer[data-gen="generating"] .sendBtn { display: none; }
  .composer[data-gen="waiting"] .sendBtn { opacity: 0.55; }

  .composerHint { margin: 6px 4px 0; font-size: var(--fs-10-5); color: var(--color-faint); display: flex; gap: 10px; flex-wrap: wrap; }
  .composerHint b { color: var(--color-muted); font-weight: var(--fw-medium); }

  /* ============ 审批右栏 ============ */
  .inspector {
    display: flex; flex-direction: column; flex: none;
    width: var(--insp-w); min-width: 0;
    border-left: 1px solid var(--color-border);
    background: var(--color-surface);
    transition: margin-right 0.26s var(--ease-out), opacity 0.26s var(--ease-out), transform 0.26s var(--ease-out);
  }
  .inspector.closedDock { margin-right: calc(-1 * var(--insp-w)); opacity: 0; pointer-events: none; }
  /* 拖拽调宽把手（inspector 左缘；≤1280 由容器查询隐藏） */
  .insGrip {
    position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
    cursor: col-resize; z-index: 22;
  }
  .insGrip::after {
    content: ""; position: absolute; left: 3.5px; top: 0; bottom: 0; width: 1px;
    background: transparent; transition: background var(--duration-fast) var(--ease-out);
  }
  .insGrip:hover::after, .insGrip.dragging::after { background: var(--color-accent); }
  .gripTip {
    position: absolute; left: 14px; top: 8px; z-index: 23;
    padding: 2px 8px; border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--color-fg) 88%, transparent);
    color: var(--color-bg);
    font-family: var(--font-mono); font-size: var(--fs-10-5);
    opacity: 0; pointer-events: none; transition: opacity var(--duration-fast) var(--ease-out);
  }
  .gripTip.show { opacity: 1; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  body.resizing .inspector { transition: none !important; }

  .insHead {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 8px 10px 8px 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
  }
  .insHead b { font-size: var(--fs-13); font-weight: var(--fw-semibold); }
  .apCnt {
    font-family: var(--font-mono); font-size: var(--fs-10-5); font-weight: var(--fw-bold);
    color: var(--color-warn); background: var(--color-warn-bg);
    padding: 1px 8px; border-radius: var(--radius-pill);
  }
  .apCnt.zero { color: var(--color-faint); background: var(--color-surface-2); }
  .apCnt.pop { animation: cnt-pop 0.3s var(--ease-out); }
  .insHead .iconBtn { width: 24px; height: 24px; }

  /* 内容目录列表（右栏）：人物/地点行 + 展开详情卡；大纲复用侧栏树样式 */
  .apPill { flex: none; font-size: 10px; font-weight: var(--fw-bold); border-radius: var(--radius-pill); padding: 1px 6px; }
  .apPill.pending { background: var(--color-warn-bg); color: var(--color-warn); }
  .apPill.approved { background: var(--color-success-bg); color: var(--color-success); }
  .apPill.rejected, .apPill.expired { background: var(--color-danger-bg); color: var(--color-danger); }
  .apPill.edited { background: var(--color-info-bg); color: var(--color-info); }

  .apIdentity { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-family: var(--font-mono); font-size: var(--fs-11); color: var(--color-faint); }
  /* 当前内容（编辑将被覆盖 / 删除将被删除 / 写入遇既有数据） */
  .apSection { margin-top: 10px; }
  .apSectionHead { display: flex; align-items: center; gap: 5px; font-size: var(--fs-10-5); font-weight: var(--fw-bold); color: var(--color-faint); letter-spacing: 0.05em; margin-bottom: 5px; }
  .apSectionHead svg { opacity: 0.7; }
  .apCur {
    border-left: 3px solid var(--color-border-strong);
    background: var(--color-surface-2);
    border-radius: 0 8px 8px 0;
    padding: 8px 12px 9px;
  }
  .apCur.edit { border-left-color: var(--color-warn); background: color-mix(in oklab, var(--color-warn) 5%, var(--color-surface)); }
  .apCur.delete { border-left-color: var(--color-danger); background: color-mix(in oklab, var(--color-danger) 5%, var(--color-surface)); }
  .apCur.add { border-left-style: dashed; }
  .apCurText { font-family: var(--font-body); font-size: var(--fs-12-5); line-height: 1.85; color: var(--color-muted); }
  .apCurText + .apParam { margin-top: 6px; }
  .apEmpty { font-size: var(--fs-11); color: var(--color-faint); }
  .apIdentity .apPill { margin-left: auto; font-size: var(--fs-10-5); }
  .apTitle { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; font-size: 14px; font-weight: var(--fw-bold); }
  .apGlyph { flex: none; width: 16px; text-align: center; font-family: var(--font-mono); font-weight: var(--fw-bold); }
  .apGlyph.add { color: var(--color-success); }
  .apGlyph.edit, .apGlyph.delete { color: var(--color-danger); }
  .apGlyph.exit { color: var(--color-accent-ink); }
  /* 设计草稿全文视图（ExitComposeMode） */
  .apDesign {
    border: 1px solid color-mix(in oklab, var(--color-accent) 18%, var(--color-border-strong));
    border-radius: var(--radius-md);
    background:
      linear-gradient(var(--color-surface), var(--color-surface)) padding-box,
      linear-gradient(120deg,
        color-mix(in oklab, var(--color-orange) 45%, transparent),
        color-mix(in oklab, var(--color-accent) 35%, transparent),
        color-mix(in oklab, var(--color-red) 40%, transparent)) border-box;
    padding: 10px 14px 12px;
  }
  .apDesign h5 { margin: 0 0 7px; font-size: var(--fs-13); font-weight: var(--fw-bold); font-family: var(--font-body); }
  .apDesign p { margin: 0 0 6px; font-size: var(--fs-12); line-height: 1.75; color: var(--color-muted); }
  .apDesign ul { margin: 0 0 6px; padding-left: 16px; }
  .apDesign li { font-size: var(--fs-12); line-height: 1.75; color: var(--color-muted); }
  .apDesign p b, .apDesign li b { color: var(--color-fg); font-weight: var(--fw-semibold); margin-right: 5px; }
  .apArgs { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .apArgsTitle { font-size: var(--fs-11); font-weight: var(--fw-bold); color: var(--color-faint); }
  .apGroup { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface); }
  .apBand { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-left: 3px solid transparent; }
  .apBand.add { background: color-mix(in oklab, var(--color-success) 18%, var(--color-surface)); border-left-color: var(--color-success); }
  .apBand.edit, .apBand.delete { background: color-mix(in oklab, var(--color-danger) 18%, var(--color-surface)); border-left-color: var(--color-danger); }
  .apBandGlyph { flex: none; width: 16px; font-family: var(--font-mono); font-weight: var(--fw-bold); text-align: center; }
  .apBand.add .apBandGlyph { color: var(--color-success); }
  .apBand.edit .apBandGlyph, .apBand.delete .apBandGlyph { color: var(--color-danger); }
  .apBandTool { font-size: var(--fs-12); font-weight: var(--fw-bold); color: var(--color-fg); }
  .apBody { padding: 8px 12px 10px; border-top: 1px solid var(--color-border); }
  .apStale {
    margin-bottom: 8px; padding: 7px 10px; border-radius: 8px;
    background: var(--color-warn-bg);
    border: 1px solid color-mix(in oklab, var(--color-warn) 28%, transparent);
    color: var(--color-warn); font-size: var(--fs-12); font-weight: var(--fw-semibold); line-height: 1.5;
  }
  .apParam { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; margin: 0; }
  .apParam dt { font-size: var(--fs-11); color: var(--color-faint); padding-top: 2px; }
  .apParam dd { margin: 0; font-size: var(--fs-12); color: var(--color-fg); line-height: 1.6; overflow-wrap: anywhere; }
  .apActions {
    display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    margin-top: 12px; padding: 10px 0 0; border-top: 1px solid var(--color-border);
  }
  .apBanner { margin-top: 14px; padding: 8px 11px; border-radius: 10px; font-size: var(--fs-12); font-weight: var(--fw-semibold); animation: view-in 0.3s var(--ease-out); }
  .apBanner.approved { background: var(--color-success-bg); color: var(--color-success); }
  .apBanner.rejected { background: var(--color-danger-bg); color: var(--color-danger); }
  .apBanner.edited { background: var(--color-info-bg); color: var(--color-info); }
  .apCommentWrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s var(--ease-out); }
  .apCommentWrap[data-open="true"] { grid-template-rows: 1fr; }
  .apCommentInner { overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .apCommentInner .apActions { position: static; border-top: 0; padding-top: 0; background: none; backdrop-filter: none; }
  .apComment {
    width: 100%; padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface); color: var(--color-fg);
    font-family: inherit; font-size: var(--fs-12-5); resize: vertical;
  }
  .apComment:focus { outline: none; border-color: var(--color-accent); }

  /* ============ 审批整体弹窗（左清单 + 右详情；阻塞式决策） ============ */
  .apModal {
    width: min(920px, 94vw); height: min(640px, 88vh);
    display: flex; flex-direction: column;
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-lg);
    background: var(--color-surface); box-shadow: var(--shadow-2);
    overflow: hidden;
    transform-origin: top center;
    animation: sheet-in 0.5s var(--ease-out);
  }
  .apModalHead {
    display: flex; align-items: center; gap: 9px; flex: none;
    padding: 11px 14px 11px 16px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
  }
  .apModalHead .hIcon { color: var(--color-warn); display: inline-flex; }
  .apModalHead b { font-size: var(--fs-13); }
  .apModalBody { flex: 1; min-height: 0; display: flex; }
  .apList {
    width: 252px; flex: none;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--color-border);
  }
  .apListScroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) transparent; }
  /* 决策脉冲：批准/拒绝/修改或新增的清单行入场高亮一次（apPulseId/apEnterId 置类，渲染后清零） */
  .apListItem.pulse { animation: appr-in 0.4s var(--ease-out); }
  .apListItem {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 9px; text-align: left;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    background: transparent; cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .apListItem:hover { background: var(--color-surface-2); }
  .apListItem.active {
    background: var(--color-accent-9);
    border-color: color-mix(in oklab, var(--color-accent) 26%, transparent);
  }
  .apListItem .apGlyph { width: 17px; font-size: var(--fs-13); }
  .aliText { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .aliText b { font-size: var(--fs-12-5); font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aliText small { font-size: var(--fs-10-5); color: var(--color-faint); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .apListFoot { flex: none; padding: 10px; border-top: 1px solid var(--color-border); }
  .apListFoot .btn { width: 100%; justify-content: center; }
  .apDetail { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .apDetailScroll {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 14px 18px 16px;
    scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) transparent;
  }
  .apDetail .apTitle { font-size: 15px; }
  .apDetailFoot { flex: none; border-top: 1px solid var(--color-border); padding: 10px 16px 12px; background: var(--color-surface); }
  .apDetailFoot .apActions { position: static; border-top: 0; padding-top: 0; background: none; backdrop-filter: none; }

  /* ============ 右栏 · 内容目录（人物/地点行展开详情卡 + 跳转完整档案） ============ */
  .rowChev { margin-left: auto; flex: none; color: var(--color-faint); display: grid; place-items: center; transition: transform .18s var(--ease-out); }
  .dirRow.open .rowChev { transform: rotate(90deg); }
  .dirDetail {
    display: none;
    margin: 2px 6px 8px 30px;
    padding: 10px 12px 11px;
    border: 1px solid color-mix(in oklab, var(--color-accent) 22%, var(--color-border));
    border-left: 2.5px solid var(--color-accent-45);
    border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--color-accent-8-t) 40%, var(--color-surface));
  }
  .dirDetail.show { display: block; animation: view-in 0.2s var(--ease-out); }
  .ddHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ddHead .avatar { width: 24px; height: 24px; font-size: 11px; }
  .ddHead .convIcon { width: 24px; height: 24px; }
  .ddHead b { font-size: var(--fs-12-5); font-weight: var(--fw-semibold); }
  .ddHead small { display: block; font-size: var(--fs-10-5); color: var(--color-faint); }
  .ddSec { font-size: var(--fs-11-5); line-height: 1.7; color: var(--color-muted); margin-bottom: 6px; }
  .ddSec > span:first-child {
    display: block; margin-bottom: 1px;
    font-size: 10px; font-weight: var(--fw-bold); color: var(--color-faint); letter-spacing: 0.06em;
  }
  .ddChips { display: flex; flex-wrap: wrap; gap: 4px; }
  .ddGo {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 3px; padding: 0; border: 0; background: none;
    color: var(--color-accent-ink); font-size: var(--fs-11-5); font-weight: var(--fw-semibold);
    cursor: pointer;
  }
  .ddGo:hover { text-decoration: underline; }
  @keyframes row-flash {
    0% { background: var(--color-accent-11); box-shadow: 0 0 0 0 var(--color-accent-45); }
    60% { background: var(--color-accent-8-t); }
    100% { background: transparent; box-shadow: 0 0 0 6px transparent; }
  }
  .dirRow.flash { animation: row-flash 1.8s var(--ease-out); border-radius: var(--radius-sm); }
  /* ============ 流内提问卡（AskUserQuestion；对话流嵌入式，与审批弹窗互不影响） ============ */
  .askGroupCard {
    border: 1px solid color-mix(in oklab, var(--color-warn) 36%, var(--color-border-strong));
    border-radius: var(--radius-md);
    background: var(--color-surface);
    box-shadow: var(--shadow-1);
    overflow: hidden;
    animation: msg-enter var(--duration-base) var(--ease-out);
  }
  .askGroupCard.done { border-color: var(--color-border-strong); }
  .askGroupHead {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-chrome-bg);
  }
  .askGroupHead .hIcon { color: var(--color-warn); display: inline-flex; }
  .askGroupCard.done .askGroupHead .hIcon { color: var(--color-success); }
  .askGroupHead b { font-size: var(--fs-13); }
  .askCnt {
    font-family: var(--font-mono); font-size: var(--fs-10-5); font-weight: var(--fw-bold);
    color: var(--color-warn); background: var(--color-warn-bg);
    padding: 1px 8px; border-radius: var(--radius-pill);
  }
  .askCnt.zero { color: var(--color-success); background: var(--color-success-bg); }
  .askGroupHead .hint { font-size: var(--fs-10-5); color: var(--color-faint); }

  .qItem + .qItem { border-top: 1px solid var(--color-border); }
  .qItemBar {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 14px; cursor: pointer;
    transition: background var(--duration-fast) var(--ease-out);
  }
  .qItemBar:hover { background: var(--color-surface-2); }
  .qItem.pending .qItemBar { background: color-mix(in oklab, var(--color-warn) 4%, transparent); }
  .qChip {
    flex: none; font-size: var(--fs-10-5); font-weight: var(--fw-semibold); letter-spacing: 0.02em;
    padding: 1px 8px; border-radius: var(--radius-pill);
    background: var(--color-accent-11); color: var(--color-accent-ink);
    border: 1px solid color-mix(in oklab, var(--color-accent) 22%, transparent);
    white-space: nowrap;
  }
  .qItemBar .qText { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .qItemBar .qText b { font-size: var(--fs-13); font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qTag { font-size: var(--fs-10-5); color: var(--color-faint); border: 1px solid var(--color-border-strong); border-radius: var(--radius-pill); padding: 0 7px; white-space: nowrap; }
  .qPill { flex: none; font-size: 10px; font-weight: var(--fw-bold); border-radius: var(--radius-pill); padding: 1px 7px; }
  .qPill.pending { background: var(--color-warn-bg); color: var(--color-warn); }
  .qPill.chosen { background: var(--color-info-bg); color: var(--color-info); }
  .qItemBar .chev { color: var(--color-faint); display: grid; place-items: center; transition: transform .18s var(--ease-out); }
  .qItem.open .qItemBar .chev { transform: rotate(180deg); }

  .qItemBody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s var(--ease-out); }
  .qItemBody[data-open="true"] { grid-template-rows: 1fr; }
  .qItemBodyInner { overflow: hidden; }
  .qItemBodyPad { padding: 4px 16px 14px 40px; }

  /* 问题标题（展开体首行：完整题目突出呈现，与折叠条的截断摘要区分） */
  .qFull {
    font-size: 14.5px;
    font-weight: 650;
    line-height: 1.55;
    margin: 4px 0 10px;
  }

  /* context md 引导块（markdown 渲染，样例含粗体/列表） */
  .qContext {
    font-size: var(--fs-12-5); line-height: 1.75; color: var(--color-muted);
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-left: 2.5px solid var(--color-accent-45);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 8px 12px 9px; margin: 0 0 9px;
  }
  .qContext b { color: var(--color-fg); font-weight: var(--fw-semibold); }
  .qContext ul { margin: 4px 0 0; padding-left: 16px; }
  .qContext li { margin: 2px 0; }
  .qContext li::marker { color: var(--color-accent-45); }
  .qContext .ex { font-family: var(--font-body); color: var(--color-fg); }

  /* 选项 */
  .optList { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    display: grid; grid-template-columns: 15px 1fr; gap: 2px 9px; align-items: start;
    padding: 8px 11px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    cursor: pointer;
    transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
  }
  .opt:hover { border-color: color-mix(in oklab, var(--color-accent) 45%, var(--color-border-strong)); }
  .opt[data-selected] {
    border-color: var(--color-accent);
    background: var(--color-accent-9);
    box-shadow: inset 0 0 0 1px var(--color-accent-45);
  }
  .optMark {
    width: 14px; height: 14px; margin-top: 3px;
    border: 1.5px solid var(--color-border-strong); border-radius: 50%;
    display: grid; place-items: center;
    transition: all var(--duration-fast) var(--ease-out);
  }
  .opt.multi .optMark { border-radius: 4px; }
  .opt[data-selected] .optMark { border-color: var(--color-accent); }
  .opt[data-selected] .optMark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--grad-accent); }
  .opt.multi[data-selected] .optMark::after { border-radius: 1px; }
  .optLabel { font-size: var(--fs-13); font-weight: var(--fw-medium); line-height: 1.5; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .recBadge {
    font-size: var(--fs-10-5); font-weight: var(--fw-semibold);
    color: var(--color-warn); background: var(--color-warn-bg);
    border: 1px solid color-mix(in oklab, var(--color-warn) 26%, transparent);
    padding: 0 7px; border-radius: var(--radius-pill); white-space: nowrap;
  }
  .optDesc { grid-column: 2; font-size: var(--fs-12); line-height: 1.65; color: var(--color-muted); }
  .optDesc b { color: var(--color-fg); font-weight: var(--fw-medium); }
  .otherInput {
    grid-column: 1 / -1; margin-top: 4px;
    font: inherit; font-size: var(--fs-12-5); color: var(--color-fg);
    background: var(--color-surface);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
    padding: 6px 9px; width: 100%; outline: none;
    transition: border-color var(--duration-fast) var(--ease-out);
  }
  .otherInput:focus { border-color: var(--color-accent); }
  .otherInput::placeholder { color: var(--color-faint); }

  /* 开放填空 */
  .openInput {
    font: inherit; font-family: var(--font-body);
    font-size: var(--fs-13); color: var(--color-fg);
    background: var(--color-surface);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
    padding: 9px 11px; width: 100%; min-height: 72px; resize: vertical; outline: none;
    line-height: 1.7;
    transition: border-color var(--duration-fast) var(--ease-out);
  }
  .openInput:focus { border-color: var(--color-accent); }
  .openInput::placeholder { color: var(--color-faint); font-family: var(--font-ui); font-size: var(--fs-12); }

  /* 组卡操作区（活动态；按钮复用既有 .btn 家族） */
  .askActions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 11px 14px; border-top: 1px solid var(--color-border);
  }
  .askActions .hint { font-size: var(--fs-11); color: var(--color-faint); margin-right: auto; }

  /* 已答简约记录（作答后留痕：整卡只渲染「题目 → 答案」行） */
  .recList { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 12px; }
  .recRow {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    font-size: var(--fs-12-5); line-height: 1.6;
  }
  .recRow .q { color: var(--color-muted); min-width: 0; }
  .recRow .arr { flex: none; color: var(--color-faint); }
  .recRow .a { color: var(--color-fg); font-weight: var(--fw-medium); }
  .recRow .a.self { font-family: var(--font-body); }
  .recRow .a.quiet { color: var(--color-muted); font-weight: var(--fw-regular); }

  /* 提问收口胶囊（.sysMsg 审批版为 warn 可点击；.ok 为 success 不可点） */
  .sysMsg.ok {
    border-color: color-mix(in oklab, var(--color-success) 32%, transparent);
    background: var(--color-success-bg); color: var(--color-success);
    cursor: default;
  }
  .sysMsg.ok:hover { box-shadow: none; transform: none; }

  /* ============ 遮罩 / 抽屉 / 弹层 ============ */
  .scrim {
    position: absolute; inset: 0; z-index: 8;
    background: color-mix(in oklab, var(--color-fg) 14%, transparent);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s var(--ease-out);
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .closedMask {
    position: absolute; inset: 0; z-index: 60;
    display: none; place-items: center;
    background: color-mix(in oklab, var(--color-bg) 82%, transparent);
    backdrop-filter: blur(6px);
  }
  .closedMask.show { display: grid; }
  .closedCard { text-align: center; }
  .closedCard .glyph { font-family: var(--font-kai); font-size: 30px; color: var(--color-faint); display: block; margin-bottom: 8px; }

  /* ============ 长任务等待动画（打开项目 / 新建会话等阻塞操作） ============ */
  .loadingMask {
    position: absolute; inset: 0; z-index: 55;
    display: none; place-items: center;
    background: color-mix(in oklab, var(--color-bg) 86%, transparent);
    backdrop-filter: blur(6px);
  }
  .loadingMask.show { display: grid; animation: view-in 0.2s var(--ease-out); }
  .loadingCard { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .loadingOrb {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--grad-accent); background-size: 160% 160%;
    animation: grad-flow 6s var(--ease-in-out) infinite, loading-bob 1.3s var(--ease-in-out) infinite;
  }
  .loadingTitle { font-size: var(--fs-13); font-weight: var(--fw-semibold); }
  .loadingSteps { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .loadingStep {
    display: flex; align-items: center; gap: 7px;
    font-size: var(--fs-12); color: var(--color-faint); font-family: var(--font-mono);
    opacity: 0.35; transition: opacity 0.25s var(--ease-out);
  }
  .loadingStep .tick {
    display: inline-grid; place-items: center; width: 13px; height: 13px;
    color: var(--color-success); opacity: 0; transform: scale(0.6);
    transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
  }
  .loadingStep.on { opacity: 1; color: var(--color-muted); }
  .loadingStep.on .tick { opacity: 1; transform: scale(1); }
  @keyframes loading-bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.06); } }

  /* ============ 启动 · 项目选择页（欢迎页） ============ */
  .welcome {
    position: absolute; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: var(--color-bg);
    overflow-y: auto; padding: 30px 20px;
  }
  .welcome.leave { animation: welcome-leave 0.45s var(--ease-out) both; pointer-events: none; }
  .welcomeInner { width: min(560px, 94vw); display: flex; flex-direction: column; }
  .welcomeBrand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 26px; animation: view-in 0.5s 0.05s var(--ease-out) both; }
  .welcomeBrand .brandDot { width: 22px; height: 22px; }
  .welcomeName { font-size: 24px; font-weight: var(--fw-bold); letter-spacing: 0.04em; font-family: var(--font-kai); }
  .welcomeTag { font-family: var(--font-kai); color: var(--color-muted); font-size: var(--fs-13); }
  .welcomeSec { font-size: var(--fs-11); color: var(--color-faint); font-weight: var(--fw-semibold); letter-spacing: 0.04em; margin: 0 2px 9px; animation: view-in 0.5s 0.12s var(--ease-out) both; }

  .wsMenu {
