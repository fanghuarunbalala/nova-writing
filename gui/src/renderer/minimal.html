<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Novel 最小对话</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #messages { border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 300px; margin-bottom: 12px; overflow-y: auto; white-space: pre-wrap; }
    .user { color: #0550ae; }
    .assistant { color: #116329; }
    #input { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; font-size: 14px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Novel 对话（T12 最小验证）</h2>
  <div id="messages"></div>
  <div id="input">
    <input id="text" placeholder="输入消息…" />
    <button id="send">发送</button>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
