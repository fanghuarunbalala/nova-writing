<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>01 · 应用壳层</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { margin: 0; }
      .novel-sidebar-conversation-row { position: relative; display: flex; align-items: center; gap: 2px; }
    </style>
  </head>
  <body>
    <div class="novel-app-shell">
      <nav class="novel-top-menu" aria-label="顶部菜单">
        <button class="novel-menu-button" type="button">项目</button>
        <button class="novel-menu-button" type="button">编辑</button>
        <button class="novel-menu-button" type="button">发布</button>
        <span class="novel-menu-spacer"></span>
        <button class="novel-menu-button" type="button">帮助</button>
      </nav>

      <div class="novel-context-bar">
        <span class="novel-context-segment">
          <span class="novel-context-label">Workspace</span>
          <button class="novel-context-workspace-button" type="button">白昼计划</button>
        </span>
        <span class="novel-context-actions">
          <button class="novel-menu-button" type="button">打开 Workspace…</button>
        </span>
      </div>

      <div class="novel-shell-body">
        <aside class="novel-project-sidebar" data-sidebar-mode="expanded" aria-label="项目导航">
          <section class="novel-sidebar-section">
            <h2 class="novel-sidebar-heading">创作</h2>
            <button class="novel-sidebar-button" type="button"><span class="novel-sidebar-marker" aria-hidden="true">+</span><span class="novel-sidebar-label">新建对话</span></button>
            <button class="novel-sidebar-button" type="button"><span class="novel-sidebar-marker" aria-hidden="true">日</span><span class="novel-sidebar-label">日程</span></button>
            <button class="novel-sidebar-button" data-query-state="ready" type="button"><span class="novel-sidebar-marker" aria-hidden="true">纲</span><span class="novel-sidebar-label">大纲</span><span class="novel-sidebar-detail">12</span></button>
            <button class="novel-sidebar-button" data-query-state="ready" type="button"><span class="novel-sidebar-marker" aria-hidden="true">人</span><span class="novel-sidebar-label">人物</span><span class="novel-sidebar-detail">3</span></button>
            <button class="novel-sidebar-button" data-query-state="ready" type="button"><span class="novel-sidebar-marker" aria-hidden="true">地</span><span class="novel-sidebar-label">地点</span><span class="novel-sidebar-detail">5</span></button>
            <button class="novel-sidebar-button" data-query-state="loading" type="button"><span class="novel-sidebar-marker" aria-hidden="true">文</span><span class="novel-sidebar-label">正文</span><span class="novel-sidebar-detail">…</span></button>
          </section>
          <section class="novel-sidebar-section">
            <h2 class="novel-sidebar-heading">对话</h2>
            <div class="novel-sidebar-conversation-row">
              <button class="novel-sidebar-button" data-active="true" type="button" style="flex:1">
                <span class="novel-sidebar-marker" aria-hidden="true">●</span>
                <span class="novel-sidebar-label">主线讨论</span>
              </button>
              <button class="novel-menu-button" aria-label="对话操作：主线讨论" type="button">⋯</button>
              <div class="novel-menu-popover">
                <button class="novel-menu-button" type="button">删除</button>
              </div>
            </div>
            <div class="novel-sidebar-conversation-row">
              <button class="novel-sidebar-button" type="button" style="flex:1">
                <span class="novel-sidebar-marker" aria-hidden="true">●</span>
                <span class="novel-sidebar-label">角色设定整理</span>
              </button>
              <button class="novel-menu-button" aria-label="对话操作：角色设定整理" type="button">⋯</button>
            </div>
          </section>
          <button class="novel-sidebar-toggle" type="button">收起侧栏</button>
        </aside>

        <main class="novel-conversation-workspace">
          <div class="novel-conversation-content">
            <div class="novel-conversation-empty">开始你的创作对话</div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
