name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @novel/core typecheck
      - run: pnpm --filter @novel/core test

  ui:
    name: ui · check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ui 运行时依赖 @novel/core 的 dist，先构建
      - run: pnpm --filter @novel/core build
      - run: pnpm --filter @novel/ui check
      - run: pnpm --filter @novel/ui test
