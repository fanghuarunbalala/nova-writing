<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>02 · 会话时间线</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { margin: 0; padding: 24px; }
    </style>
  </head>
  <body>
    <section class="novel-conversation-view" data-controller-state="live">
      <header class="novel-conversation-header">
        <span>Conversation</span>
        <div class="novel-connection-status" data-runtime-status="generating" role="status"><span>生成中</span><button class="novel-connection-action" type="button">停止</button></div>
      </header>

      <div class="novel-conversation-timeline">
        <article class="novel-message novel-user-message" data-sequence="1">
          <header class="novel-message-header"><span>你</span><span>14:00</span></header>
          <div class="novel-message-text">帮我把第一幕的雨夜相遇写得更克制一些。</div>
          <button class="novel-connection-action" type="button">重发</button>
        </article>

        <article class="novel-message novel-assistant-message" data-message-status="completed" data-sequence="2">
          <header class="novel-message-header"><span>助手</span><span>14:00</span><span class="novel-status-token">已完成</span></header>
          <div class="novel-assistant-content">
            <details class="novel-thinking-block"><summary>思考过程</summary><div>先收敛人物动机，再压缩场景描述。</div></details>
            <div class="novel-message-text">可以。把“雨很大”改成“雨落得密”，用一句动作代替三句形容。</div>
          </div>
        </article>

        <article class="novel-message novel-assistant-message" data-message-status="streaming" data-sequence="3">
          <header class="novel-message-header"><span>助手</span><span>14:01</span><span class="novel-status-token">生成中</span></header>
          <div class="novel-assistant-content">
            <div class="novel-message-text">好，我按这个方向重写第一幕的开场：</div>
            <span class="novel-streaming-cursor" aria-label="助手正在生成">●</span>
          </div>
        </article>

        <article class="novel-message novel-assistant-message" data-message-status="failed" data-sequence="4">
          <header class="novel-message-header"><span>助手</span><span>14:02</span><span class="novel-status-token">失败</span></header>
          <div class="novel-assistant-content">
            <p class="novel-message-notice" role="status">本轮生成失败：provider_error</p>
            <button class="novel-connection-action" type="button">重试</button>
          </div>
        </article>

        <article class="novel-message novel-assistant-message" data-message-status="cancelled" data-sequence="5">
          <header class="novel-message-header"><span>助手</span><span>14:03</span><span class="novel-status-token">已停止</span></header>
          <div class="novel-assistant-content">
            <p class="novel-message-notice" role="status">本轮生成已停止</p>
            <button class="novel-connection-action" type="button">重试</button>
          </div>
        </article>

        <article class="novel-approval-card" data-approval-status="pending">
          <header class="novel-card-header"><span>操作确认</span><span>14:04</span></header>
          <h3>执行 TodoWrite</h3>
          <p>更新当前创作计划为三步。</p>
          <div class="novel-card-status">等待确认</div>
          <footer>
            <button class="novel-connection-action" type="button">允许</button>
            <button class="novel-connection-action" type="button">拒绝</button>
          </footer>
        </article>
      </div>

      <button class="novel-follow-latest" type="button">有新消息，回到最新</button>
    </section>

    <h2>连接状态</h2>
    <div class="novel-connection-status" data-connection-state="live" role="status"><span>已连接</span></div>
    <div class="novel-connection-status" data-connection-state="disconnected" role="alert"><span>连接已断开</span><code class="novel-connection-error-code">ELECTRON_PRELOAD_BRIDGE_UNAVAILABLE</code><button class="novel-connection-action" type="button">重新连接</button></div>

  </body>
</html>
